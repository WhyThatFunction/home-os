# ArgoCD repository credential for the PRIVATE github.com/vaam-apps/vaam-apps
# repo. ArgoCD's repo-server needs this to clone `deploy/chart` at all — a
# GitHub App installation token is 403 Forbidden on org-owned private repos
# (verified elsewhere in this fleet), so this is a user PAT.
#
# REUSES the fleet's shared GHCR/GitHub credential object
# (prod/meta/test-app @ ssegning-aws) — the same one ssegning-com's
# imagePullSecret uses — the owner's stated preference is to reuse existing
# credential objects rather than mint new ones per app.
#
# Lands in the argocd namespace (forced by this dir's kustomization) and is
# applied by the vaam-apps-argocd-creds Application, so the `vaam`
# Application (charts/apps/values.yaml) can sync.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaam-apps-repo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: vaam-apps-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        name: vaam-apps
        type: git
        url: https://github.com/vaam-apps/vaam-apps
        username: "{{ .github_username }}"
        password: "{{ .github_token }}"
  data:
    - secretKey: github_username
      remoteRef:
        key: prod/meta/test-app
        property: github_username
    - secretKey: github_token
      remoteRef:
        key: prod/meta/test-app
        property: github_token
