# ArgoCD OCI Helm credential for the PRIVATE widgetbook chart published by
# vaam-store/mobile at `oci://ghcr.io/vaam-store/charts/mobile/widgetbook`.
#
# ## Why this exists when ../vaam-store-platform already provisions a
# ## ghcr.io/vaam-store/charts credential
#
# That one (`vaam-store-platform-charts-oci-repo`) is a `repository`-type
# secret, and its url is the literal `ghcr.io/vaam-store/charts`. ArgoCD
# matches a `repository` secret by EXACT url, so it covers the eight platform
# charts and the three frontends charts -- all of which sit directly under that
# path and are reached with `repoURL: ghcr.io/vaam-store/charts` + `chart:
# <name>`.
#
# vaam-store/mobile publishes ONE path segment deeper
# (`<owner>/charts/<repo>/<chart>`, see that repo's .github/workflows/
# helm-chart.yml), so its Application names the full chart path as its repoURL
# with `chart: "."` -- the same shape ~30 working Applications on this cluster
# already use for oci://ghcr.io/adorsys-gis/charts/*. That repoURL is NOT an
# exact match for the platform secret's url, so it needs its own credential.
#
# `repo-creds`, NOT `repository`: repo-creds match by url PREFIX, so this one
# secret covers `mobile/widgetbook` and any future
# `ghcr.io/vaam-store/charts/<repo>/<chart>` without another PR. It does not
# shadow or conflict with the platform `repository` secret -- ArgoCD prefers an
# exact repository match when one exists and only falls back to repo-creds
# otherwise. Exactly the pairing `adorsys-gis-charts-oci-creds` (repo-creds,
# `oci://ghcr.io/adorsys-gis/charts`) and `adorsys-gis-charts-oci-repo`
# (repository, one exact chart under it) already have in the argocd namespace.
#
# Same store and same AWS SM object as every other GHCR credential in this
# fleet: ClusterSecretStore `ssegning-aws`, key `prod/meta/test-app`,
# properties github_username / github_token -- reused per the owner's standing
# "don't mint a new GHCR-credential object" direction, see
# ../vaam-store-platform/argocd-charts-oci-repo.externalsecret.yaml.
#
# NAMED `vaam-store-mobile-*`, deliberately not the bare `vaam-store-charts-
# oci-repo`: the stale, unwired `charts/home-apps/vaam-store-prod-deployer`
# chart generates an ExternalSecret with exactly that bare name in this same
# namespace. It is dead today, but two `creationPolicy: Owner` ExternalSecrets
# racing for one Secret name is a bug that stays invisible until someone
# revives it. Same reasoning as the `platform` infix next door.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaam-store-mobile-charts-oci-creds
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: vaam-store-mobile-charts-oci-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # repo-creds, not repository -- see this file's header comment.
          argocd.argoproj.io/secret-type: repo-creds
      data:
        # Prefix, with the oci:// scheme, matching how the working
        # adorsys-gis repo-creds secret on this cluster is written.
        url: oci://ghcr.io/vaam-store/charts
        type: helm
        enableOCI: "true"
        username: "{{ .github_username }}"
        password: "{{ .github_token }}"
  data:
    - secretKey: github_username
      remoteRef:
        key: prod/meta/test-app
        property: github_username
    - secretKey: github_token
      remoteRef:
        key: prod/meta/test-app
        property: github_token
