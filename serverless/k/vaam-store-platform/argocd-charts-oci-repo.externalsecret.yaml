# ArgoCD repository credential for the PRIVATE OCI Helm charts under
# ghcr.io/vaam-store/charts/<service>. A GitHub-App git cred can't auth a
# GHCR Helm pull, so ArgoCD needs a repository-type secret (type: helm +
# enableOCI + username/password). One credential covers all 8 charts (same
# registry namespace, `ghcr.io/vaam-store/charts`).
#
# REUSES vymalo's `prod/meta/test-app` AWS SM object (owner direction,
# 2026-08-21: "we have a lot of templates in home-os of where [GHCR creds
# are]" -- don't mint yet another GHCR-credential object when this fleet
# already has several, this one included). Same shape as
# serverless/k/vymalo-shop/ghcr-pull.externalsecret.yaml and
# .../argocd-charts-oci-repo.externalsecret.yaml: ClusterSecretStore
# `ssegning-aws`, key `prod/meta/test-app`, properties github_username /
# github_token. This assumes that PAT already has (or is granted)
# `read:packages` on the `vaam-store` org, not just `vymalo` -- verify
# before the first sync; a fine-grained PAT scoped to one org won't cover
# the other. A previous draft of this file used a dedicated
# `prod/vaam-store-platform/ghcr` object instead, reasoning that a shared
# credential couples the two orgs' credential lifecycles -- correct in
# isolation, but overridden by the owner's explicit preference to reuse
# existing objects over minting new ones.
#
# Requires ESO on home-remote (see the secret-store app in
# charts/home-apps/secret-store). Lands in the argocd namespace (forced by
# this dir's kustomization) and is applied by the vaam-store-platform-deployer
# app, so the 8 vaam-store-platform Applications can pull their charts
# without making the packages public.
#
# NAMED `vaam-store-platform-*`, not `vaam-store-*` (lightbridge-assistant
# P2, PR #122): the stale, unwired `charts/home-apps/vaam-store-prod-deployer`
# chart already generates ExternalSecrets literally named `vaam-store-charts-
# oci-repo` / `vaam-store-ghcr-pull` in this same `argocd` namespace (from a
# different AWS SM key, `prod/vaam/env`). That chart is confirmed dead --
# not referenced by any `applications:` list in charts/apps or charts/cd --
# so there's no live collision today, but two `creationPolicy: Owner`
# ExternalSecrets racing for one Secret name is exactly the kind of bug that
# stays invisible until someone revives the old chart. The `platform` infix
# costs nothing and removes the collision surface entirely.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaam-store-platform-charts-oci-repo
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: vaam-store-platform-charts-oci-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # Tells ArgoCD to treat this Secret as a repository credential.
          argocd.argoproj.io/secret-type: repository
      data:
        name: vaam-store-platform-charts
        type: helm
        # Must match spec.sources[].repoURL in argocd-application.yaml.
        url: ghcr.io/vaam-store/charts
        enableOCI: "true"
        username: "{{ .github_username }}"
        password: "{{ .github_token }}"
  data:
    - secretKey: github_username
      remoteRef:
        key: prod/meta/test-app
        property: github_username
    - secretKey: github_token
      remoteRef:
        key: prod/meta/test-app
        property: github_token
