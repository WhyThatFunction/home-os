# ArgoCD repository credential for the PRIVATE OCI Helm charts under
# ghcr.io/vaam-store/charts/<service>. A GitHub-App git cred can't auth a
# GHCR Helm pull, so ArgoCD needs a repository-type secret (type: helm +
# enableOCI + username/password). One credential covers all 8 charts (same
# registry namespace, `ghcr.io/vaam-store/charts`).
#
# Dedicated AWS SM object (prod/vaam-store-platform/ghcr), NOT vymalo's
# prod/meta/test-app -- keeps vaam-store's credential lifecycle independent
# of vymalo's, even though both may end up holding the same GitHub PAT value
# if that PAT already has read:packages on both the vymalo and vaam-store
# orgs (confirm before assuming; a fine-grained PAT scoped to one org won't
# work for the other). See this PR's description for the exact AWS SM key
# list.
#
# Requires ESO on home-remote (see the secret-store / vaam-secret-store apps
# in charts/home-apps/secret-store). Lands in the argocd namespace (forced by
# this dir's kustomization) and is applied by the vaam-store-platform-deployer
# app, so the 8 vaam-store-platform Applications can pull their charts
# without making the packages public.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaam-store-charts-oci-repo
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: vaam-store-charts-oci-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          # Tells ArgoCD to treat this Secret as a repository credential.
          argocd.argoproj.io/secret-type: repository
      data:
        name: vaam-store-charts
        type: helm
        # Must match spec.sources[].repoURL in argocd-application.yaml.
        url: ghcr.io/vaam-store/charts
        enableOCI: "true"
        username: "{{ .github_username }}"
        password: "{{ .github_token }}"
  data:
    - secretKey: github_username
      remoteRef:
        key: prod/vaam-store-platform/ghcr
        property: github_username
    - secretKey: github_token
      remoteRef:
        key: prod/vaam-store-platform/ghcr
        property: github_token
