# GHCR read credential for the argocd-image-updater controller.
#
# The CRD-based image-updater (ns argocd-image-updater) queries GHCR for each
# vaam-store-platform service's new signed digest. The images
# (ghcr.io/vaam-store/platform/<service>) are PRIVATE, so an anonymous query
# returns `unauthorized` and no digest ever promotes -- only chart
# republishes (a Chart.yaml version bump) deploy. This Secret is the missing
# credential: each app references it via a
# `argocd-image-updater.argoproj.io/app.pull-secret: pullsecret:argocd/vaam-store-platform-ghcr-pull`
# annotation, and the controller's argocd-namespace secret-read RBAC already
# ships in charts/argocd-image-updater (Role argocd-image-updater-argocd-config).
#
# Same underlying creds as the argocd-charts-oci-repo.externalsecret.yaml
# next to this file -- ClusterSecretStore `ssegning-aws`, key
# `prod/meta/test-app` (REUSED from vymalo-shop's own credential, owner
# direction 2026-08-21 -- see that file's header for the full rationale),
# properties github_username / github_token (a PAT with read:packages on
# the vaam-store org, assumed to also cover vymalo's -- verify before first
# sync). Lands in the argocd namespace (forced by this dir's kustomization).
#
# NAMED `vaam-store-platform-ghcr-pull`, not `vaam-store-ghcr-pull`
# (lightbridge-assistant P2, PR #122): the stale, unwired
# `charts/home-apps/vaam-store-prod-deployer` chart already generates an
# ExternalSecret with the bare `vaam-store-ghcr-pull` name in this same
# `argocd` namespace, from a different AWS SM key (`prod/vaam/env`). See the
# longer note in argocd-charts-oci-repo.externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaam-store-platform-ghcr-pull
  labels:
    app.kubernetes.io/part-of: vaam-store-platform
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: vaam-store-platform-ghcr-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .github_username }}","password":"{{ .github_token }}","auth":"{{ printf "%s:%s" .github_username .github_token | b64enc }}"}}}'
  data:
    - secretKey: github_username
      remoteRef:
        key: prod/meta/test-app
        property: github_username
    - secretKey: github_token
      remoteRef:
        key: prod/meta/test-app
        property: github_token
