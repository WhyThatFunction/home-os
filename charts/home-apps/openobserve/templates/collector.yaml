apiVersion: apps/v1
kind: Deployment
metadata:
  name: openobserve-collector
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
spec:
  replicas: {{ .Values.collector.replicas }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: openobserve-collector
  template:
    metadata:
      labels:
        {{- toYaml .Values.global.labels | nindent 8 }}
        app.kubernetes.io/name: openobserve-collector
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/collector-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: openobserve-collector
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ .Values.collector.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml
          env:
            - name: OPENOBSERVE_BASIC_AUTH
              valueFrom:
                secretKeyRef:
                  name: openobserve-root
                  key: OPENOBSERVE_BASIC_AUTH
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            {{- toYaml .Values.collector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: openobserve-collector
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openobserve-collector
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: openobserve-collector
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openobserve-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
