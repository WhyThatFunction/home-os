apiVersion: v1
kind: ServiceAccount
metadata:
  name: openobserve-collector
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
---
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: openobserve
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  managementState: managed
  mode: deployment
  replicas: {{ .Values.collector.replicas }}
  image: {{ .Values.collector.image | quote }}
  imagePullPolicy: IfNotPresent
  upgradeStrategy: none
  serviceAccount: openobserve-collector
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  resources:
    {{- toYaml .Values.collector.resources | nindent 4 }}
  env:
    - name: OPENOBSERVE_BASIC_AUTH
      valueFrom:
        secretKeyRef:
          name: openobserve-root
          key: OPENOBSERVE_BASIC_AUTH
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: rustfs-monitoring
          key: AWS_ACCESS_KEY_ID
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: rustfs-monitoring
          key: AWS_SECRET_ACCESS_KEY
    - name: AWS_EC2_METADATA_DISABLED
      value: "true"
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
  ports:
    - name: otlp-grpc
      port: 4317
      protocol: TCP
      appProtocol: grpc
    - name: otlp-http
      port: 4318
      protocol: TCP
      appProtocol: http
    - name: health
      port: 13133
      protocol: TCP
      appProtocol: http
  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30
  config:
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 384
        spike_limit_mib: 96
      batch:
        send_batch_size: {{ .Values.collector.batchSize }}
        send_batch_max_size: {{ .Values.collector.batchSize }}
        timeout: {{ .Values.collector.batchTimeout }}
    exporters:
      otlp_http/openobserve:
        endpoint: http://openobserve:5080/api/default
        headers:
          Authorization: ${env:OPENOBSERVE_BASIC_AUTH}
        timeout: 20s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 1000
      {{- range $signal := list "logs" "metrics" "traces" }}
      awss3/{{ $signal }}:
        marshaler: otlp_json
        s3uploader:
          region: {{ $.Values.collector.rustfs.region | quote }}
          s3_bucket: {{ $.Values.collector.rustfs.bucket | quote }}
          s3_base_prefix: {{ $.Values.collector.rustfs.basePrefix | quote }}
          s3_prefix: {{ $signal | quote }}
          s3_partition_format: "year=%Y/month=%m/day=%d/hour=%H"
          s3_partition_timezone: UTC
          endpoint: {{ $.Values.collector.rustfs.endpoint | quote }}
          s3_force_path_style: true
          disable_ssl: true
          storage_class: STANDARD
          compression: gzip
          retry_mode: standard
          retry_max_attempts: 5
          retry_max_backoff: 30s
          unique_key_func_name: uuidv7
        timeout: 20s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 1000
      {{- end }}
    service:
      extensions:
        - health_check
      pipelines:
        {{- range $signal := list "logs" "metrics" "traces" }}
        {{ $signal }}:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp_http/openobserve, awss3/{{ $signal }}]
        {{- end }}
