apiVersion: v1
kind: ServiceAccount
metadata:
  name: openobserve-rustfs-secret-reader
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openobserve-rustfs-secret-reader
  namespace: s3
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["minio-users"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openobserve-rustfs-secret-reader
  namespace: s3
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openobserve-rustfs-secret-reader
subjects:
  - kind: ServiceAccount
    name: openobserve-rustfs-secret-reader
    namespace: {{ .Release.Namespace }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rustfs
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    kubernetes:
      remoteNamespace: s3
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: openobserve-rustfs-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-monitoring
  labels:
    {{- toYaml .Values.global.labels | nindent 4 }}
    app.kubernetes.io/name: openobserve-collector
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: rustfs
  target:
    name: rustfs-monitoring
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        AWS_ACCESS_KEY_ID: '{{ `{{ .record | regexFind "(?m)^username=[^\\n]+" | trimPrefix "username=" }}` }}'
        AWS_SECRET_ACCESS_KEY: '{{ `{{ .record | regexFind "(?m)^password=[^\\n]+" | trimPrefix "password=" }}` }}'
  data:
    - secretKey: record
      remoteRef:
        key: minio-users
        property: monitoring-user
