{{- $c := .Values.cluster -}}
{{- $b := .Values.backup -}}
{{- $certs := .Values.certificates -}}
---
# barman-cloud ObjectStore for CNPG backups + WAL archival. Points at the
# self-hosted MinIO at s3.ssegning.me (path-style).
{{- if $b.enabled }}
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: {{ $c.name }}-object-store
  labels:
    app.kubernetes.io/part-of: vaam-store-prod
spec:
  configuration:
    destinationPath: s3://{{ $b.bucket }}{{ $b.path }}
    endpointURL: {{ $b.endpoint | quote }}
    s3Credentials:
      accessKeyId:
        name: vaam-prod-cnpg-s3-creds
        key: accessKeyId
      secretAccessKey:
        name: vaam-prod-cnpg-s3-creds
        key: secretKey
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: {{ $b.retention | quote }}
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: {{ $c.name }}-scheduled-backup
  labels:
    app.kubernetes.io/part-of: vaam-store-prod
spec:
  cluster:
    name: {{ $c.name }}
  schedule: {{ $b.schedule | quote }}
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
{{- end }}
---
{{- if $certs.enabled }}
# Empty Secret CNPG will fill via the bound Certificate; labelled cnpg.io/reload
# so the operator restarts pods on cert rotation.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $c.name }}-certificate-holder
  labels:
    cnpg.io/reload: ""
    app.kubernetes.io/part-of: vaam-store-prod
type: Opaque
data: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $c.name }}-certificate
  labels:
    app.kubernetes.io/part-of: vaam-store-prod
spec:
  secretName: {{ $c.name }}-certificate-holder
  usages:
    - server auth
  # CNPG's own auto-generated Service names are `<cluster-name>-rw/-r/-ro`
  # (no extra "-cluster-" infix) -- a previous, never-synced version of this
  # chart had "-cluster-rw" etc. here, which would NOT have matched the real
  # Service CNPG creates. Fixed.
  dnsNames:
    - {{ $c.name }}-rw
    - {{ $c.name }}-rw.{{ .Release.Namespace }}
    - {{ $c.name }}-rw.{{ .Release.Namespace }}.svc
    - {{ $c.name }}-r
    - {{ $c.name }}-r.{{ .Release.Namespace }}
    - {{ $c.name }}-r.{{ .Release.Namespace }}.svc
    - {{ $c.name }}-ro
    - {{ $c.name }}-ro.{{ .Release.Namespace }}
    - {{ $c.name }}-ro.{{ .Release.Namespace }}.svc
  issuerRef:
    name: {{ $certs.issuerName }}
    kind: {{ $certs.issuerKind }}
    group: cert-manager.io
{{- end }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $c.name }}
  labels:
    app.kubernetes.io/part-of: vaam-store-prod
spec:
  instances: {{ $c.instances }}
  {{- with $c.imageName }}
  imageName: {{ . | quote }}
  {{- end }}

  # bootstrap.initdb.secret is set (via templates/externalsecret.yaml,
  # ExternalSecret {{ $c.name }}-owner-secret) so the `vaam` role's password
  # is a value a human chose (openssl rand -hex 32, guaranteed URI-safe),
  # NOT CNPG's own auto-generated one -- CNPG's default generator (sethvargo/
  # go-password, default symbol set) CAN emit URI-reserved characters, which
  # would break every vaam-store/platform chart's ExternalSecret template
  # (string-concatenates this password into a postgres:// URI, does not
  # percent-encode it -- see those charts' own README, "Pointing at a shared
  # Postgres cluster"). Controlling the character set at the source removes
  # that whole risk class instead of working around it downstream.
  bootstrap:
    initdb:
      database: app                        # bootstrap DB; per-service DBs are
                                           # created by the Database CRs below
      owner: vaam
      secret:
        name: {{ $c.name }}-owner-secret

  {{- if $certs.enabled }}
  certificates:
    serverTLSSecret: {{ $c.name }}-certificate-holder
    serverCASecret:  {{ $c.name }}-certificate-holder
  {{- end }}

  storage:
    size: {{ $c.storageSize }}
    {{- with $c.storageClass }}
    storageClass: {{ . | quote }}
    {{- end }}

  resources:
    {{- toYaml $c.resources | nindent 4 }}

  {{- if $b.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ $c.name }}-object-store
  {{- end }}
{{- range .Values.databases }}
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ $c.name }}-{{ .name | replace "_" "-" }}
  labels:
    app.kubernetes.io/part-of: vaam-store-prod
spec:
  name: {{ .name }}
  owner: vaam
  cluster:
    name: {{ $c.name }}
  {{- with .extensions }}
  # CNPG creates these as superuser; the services' own
  # `CREATE EXTENSION IF NOT EXISTS` migrations then become no-ops (the
  # vaam app role can't create untrusted extensions like postgis itself).
  extensions:
    {{- range . }}
    - name: {{ . }}
      ensure: present
    {{- end }}
  {{- end }}
{{- end }}
