{{- $c := .Values.cluster -}}
{{- $es := .Values.externalSecret -}}
{{- if $es.enabled }}
# Pre-seeds the CNPG bootstrap owner role's password from AWS Secrets
# Manager, so it's a value a human chose (URI-safe) rather than CNPG's own
# auto-generated one -- see templates/cnpg.yaml's bootstrap.initdb comment
# for why. PreSync hook, earlier weight than the Cluster (a plain Sync-phase
# resource) needs it applied first.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $c.name }}-owner-secret
  labels:
    app.kubernetes.io/part-of: vaam-store-prod
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ $c.name }}-owner-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      # CNPG's bootstrap.initdb.secret expects exactly these two keys.
      data:
        username: {{ $es.username | quote }}
        password: {{ printf "{{ .%s }}" $es.passwordRemoteProperty | quote }}
  data:
    - secretKey: {{ $es.passwordRemoteProperty | quote }}
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ $es.passwordRemoteProperty | quote }}
{{- end }}
{{- if and $es.enabled $es.s3.enabled .Values.backup.enabled }}
---
# S3 credentials for the barman-cloud ObjectStore in templates/cnpg.yaml.
#
# Without this Secret the ObjectStore cannot authenticate and EVERY backup
# fails with `secrets "vaam-prod-cnpg-s3-creds" not found` -- which is exactly
# what happened for 11 consecutive nights (2026-08-22 .. 2026-09-01) while the
# only chart declaring it (charts/home-apps/vaam-store-prod-secrets, via the
# undeployed vaam-store-prod-deployer) sat orphaned. See values.yaml
# `externalSecret.s3` for the full reasoning and why the orphaned chart is NOT
# the right place to fix it.
#
# Reuses the same MinIO user the upload-service already uses; `vaam-store-policy`
# in charts/s3/values.yaml already grants it s3:* on the vaam-cnpg-backups bucket.
#
# NOT a Helm hook, unlike the owner secret above: nothing needs this at cluster
# bootstrap time. It is read by the barman-cloud plugin sidecar at BACKUP time,
# so ordinary Sync-phase creation is correct and avoids the hook's
# delete-and-recreate churn on a credential that is read continuously by the
# WAL archiver.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $es.s3.secretName }}
  labels:
    app.kubernetes.io/part-of: vaam-store-prod
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    name: {{ $es.storeName }}
    kind: {{ $es.storeKind }}
  target:
    name: {{ $es.s3.secretName }}
    creationPolicy: Owner
  data:
    # Key names are fixed by the ObjectStore's s3Credentials block in
    # templates/cnpg.yaml -- accessKeyId / secretKey.
    - secretKey: accessKeyId
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ $es.s3.accessKeyRemoteProperty | quote }}
    - secretKey: secretKey
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ $es.s3.secretKeyRemoteProperty | quote }}
{{- end }}
