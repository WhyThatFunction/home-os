# vaam-store-prod-pg — ONE CNPG cluster + one Database CR per
# vaam-store/platform service + barman-cloud backups
# (s3.ssegning.me/vaam-cnpg-backups) + a simple AUTH-less in-namespace Redis.
#
# REVIVED (previously unwired, stale topology -- see git history) for the
# vaam-store/platform 8-service fleet: 7 Postgres-backed services share
# THIS one cluster (the platform charts' own bundled-per-service CNPG path,
# `database.cnpg.enabled`, stays OFF in production -- see
# vaam-store/deploy's envs/production/*.values.yaml, `database.shared.*`).
# p2p-mailbox-service needs no database at all (ADR-0007, Redis-only).
#
# The `vaam` role's password is NOT auto-generated by CNPG here (that risks
# a URI-reserved character landing in a connection string a downstream
# ExternalSecret template string-concatenates, not percent-encodes --
# see templates/externalsecret.yaml's own comment). Instead it's pre-seeded
# from AWS Secrets Manager (vaam/prod/env, property
# platform_postgres_password) via bootstrap.initdb.secret, so the value is
# whatever a human puts there -- generate it with `openssl rand -hex 32`
# (guaranteed URI-safe) and it becomes every service's DB password.
#
# Cluster name is fixed at `vaam-prod-pg`, so CNPG's own auto-generated
# resources are named `vaam-prod-pg-rw` (read-write Service) and
# `vaam-prod-pg-app` (Secret) -- NOT `vaam-prod-pg-cluster-*` (an earlier,
# never-synced version of this chart had that wrong in its own comments and
# in the Certificate's dnsNames; fixed here). Redis is private ClusterIP,
# no AUTH.

cluster:
  name: vaam-prod-pg          # → service vaam-prod-pg-rw, secret vaam-prod-pg-app
  instances: 3
  storageSize: 10Gi
  # storageClass: longhorn    # uncomment to pin SC; defaults to the cluster default
  # MUST be a postgis-flavored operand: catalog_db and delivery_db both need
  # the extension (below), and CNPG runs ONE Postgres image for every
  # database in the cluster -- there's no per-database image. Matches the
  # image vaam-store/platform's own (now-unused-in-production) per-service
  # delivery-gateway chart's `database.cnpg.imageName` pin, for the
  # identical reason.
  #
  # ghcr.io/cloudnative-pg/postgis and ghcr.io/cloudnative-pg/postgresql
  # are TWO DIFFERENT repos with DIFFERENT tag conventions -- don't copy a
  # tag suffix from one to the other. `postgresql` publishes an OS-flavour
  # suffix (`18.1-system-trixie`, as ../keycloak-ha/values.yaml pins it in
  # this same home-os fleet). `postgis` does NOT: as of 2026-08-21 its
  # tags are plain `<pg-major>-<postgis-minor>[-<patch>]` (e.g.
  # `16-3.4-86`) with zero `-system-trixie`/`-trixie` variants published,
  # confirmed against the live GHCR tag list
  # (`ghcr.io/v2/cloudnative-pg/postgis/tags/list`), not assumed. A prior
  # pin here (`16-3.4-system-trixie`) carried the `postgresql` repo's
  # suffix over to `postgis`, where the tag simply does not exist -- 100%
  # ImagePullBackOff, the first-sync outage this comment now warns
  # against repeating.
  #
  # Deliberately patch-PINNED (not the floating `16-3.4`) per this repo's
  # release-engineering convention: a database operand must not change
  # under a live cluster on an unrelated pod restart. Bump by re-checking
  # the tag list above and re-verifying the new tag resolves before
  # changing this line -- don't just take the newest number on faith.
  #
  # PG major is 16, NOT the 18 that ../keycloak-ha/values.yaml pins for
  # its own (plain, non-postgis) CNPG operand -- that gap is NOT a
  # deliberate fleet-wide decision, it's simply what this chart's original
  # guess picked (same unverified origin as the broken tag it used to
  # carry). Left as 16 here since bumping a database major is out of
  # scope for a tag fix; revisit deliberately if/when this cluster is
  # provisioned for real.
  imageName: "ghcr.io/cloudnative-pg/postgis:16-3.4-86"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Pre-seeds the `vaam` role's password via ESO instead of letting CNPG
# auto-generate one (see the file header above for why). Also the SAME
# object every vaam-store/platform service's own ExternalSecret reads
# `platform_postgres_password` from (database.shared.passwordRemoteProperty)
# -- one shared password, one shared property, no per-service secret.
externalSecret:
  enabled: true
  storeName: ssegning-aws
  storeKind: ClusterSecretStore
  remoteKey: vaam/prod/env
  secretName: vaam-prod-pg-owner
  refreshInterval: 1h
  passwordRemoteProperty: platform_postgres_password
  username: vaam

databases:
  # One CNPG Database CR per vaam-store/platform Postgres-backed service.
  # Owner is the bootstrap user (`vaam`, seeded above); each
  # vaam-store/platform chart's `database.shared.*` values compose its own
  # VAAM_DATABASE_URL against the SAME role, overriding only the database
  # name. `extensions` are created by CNPG as superuser (the `vaam` role
  # can't create untrusted extensions like postgis itself); the CNPG
  # postgis-flavored operand image bundles the libs (see cluster.imageName
  # override note below if you enable extensions).
  - name: auth_db
  - name: catalog_db
    extensions: [postgis]   # catalog 0001_init.sql: CREATE EXTENSION postgis
  - name: delivery_db
    extensions: [postgis]   # delivery 0005_postgis_geo.sql
  - name: order_db
  - name: payment_db
  - name: upload_db
  - name: vendor_db

backup:
  enabled: true
  # barman-cloud target. Bucket must exist on s3.ssegning.me; create with:
  #   mc mb ssegning/vaam-cnpg-backups
  endpoint: https://s3.ssegning.me
  bucket: vaam-cnpg-backups
  path: /vaam-store-prod
  retention: 30d
  schedule: "0 0 3 * * *"   # daily at 03:00

certificates:
  enabled: true
  # Reuses the home-os self-signed-ca ClusterIssuer for Postgres TLS,
  # matching the keycloak-ha pattern.
  issuerName: self-signed-ca
  issuerKind: ClusterIssuer

redis:
  enabled: true
  image: redis:8.6.2-trixie
  replicas: 1
  storageSize: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
