# vaam-store-prod-pg — ONE CNPG cluster + one Database CR per
# vaam-store/platform service + barman-cloud backups
# (s3.ssegning.me/vaam-cnpg-backups) + a simple AUTH-less in-namespace Redis.
#
# REVIVED (previously unwired, stale topology -- see git history) for the
# vaam-store/platform 8-service fleet: 7 Postgres-backed services share
# THIS one cluster (the platform charts' own bundled-per-service CNPG path,
# `database.cnpg.enabled`, stays OFF in production -- see
# vaam-store/deploy's envs/production/*.values.yaml, `database.shared.*`).
# p2p-mailbox-service needs no database at all (ADR-0007, Redis-only).
#
# The `vaam` role's password is NOT auto-generated by CNPG here (that risks
# a URI-reserved character landing in a connection string a downstream
# ExternalSecret template string-concatenates, not percent-encodes --
# see templates/externalsecret.yaml's own comment). Instead it's pre-seeded
# from AWS Secrets Manager (vaam/prod/env, property
# platform_postgres_password) via bootstrap.initdb.secret, so the value is
# whatever a human puts there -- generate it with `openssl rand -hex 32`
# (guaranteed URI-safe) and it becomes every service's DB password.
#
# Cluster name is fixed at `vaam-prod-pg`, so CNPG's own auto-generated
# resources are named `vaam-prod-pg-rw` (read-write Service) and
# `vaam-prod-pg-app` (Secret) -- NOT `vaam-prod-pg-cluster-*` (an earlier,
# never-synced version of this chart had that wrong in its own comments and
# in the Certificate's dnsNames; fixed here). Redis is private ClusterIP,
# no AUTH.

cluster:
  name: vaam-prod-pg          # → service vaam-prod-pg-rw, secret vaam-prod-pg-app
  instances: 3
  storageSize: 10Gi
  # storageClass: longhorn    # uncomment to pin SC; defaults to the cluster default
  # MUST be a postgis-flavored operand: catalog_db and delivery_db both need
  # the extension (below), and CNPG runs ONE Postgres image for every
  # database in the cluster -- there's no per-database image. Matches the
  # image vaam-store/platform's own (now-unused-in-production) per-service
  # delivery-gateway chart's `database.cnpg.imageName` pin, for the
  # identical reason.
  #
  # ghcr.io/cloudnative-pg/postgis and ghcr.io/cloudnative-pg/postgresql
  # are TWO DIFFERENT repos with DIFFERENT tag conventions -- don't copy a
  # tag suffix from one to the other. `postgresql` publishes an OS-flavour
  # suffix (`18.1-system-trixie`, as ../keycloak-ha/values.yaml pins it in
  # this same home-os fleet). `postgis` does too, but only from the PG 18
  # line onward, and in the fuller
  # `<pgMajor.minor>-<postgisVersion>-<buildTimestamp>-<flavour>-<os>`
  # form (e.g. `18.6-3.6.4-202608171012-standard-trixie`) -- fully
  # patch-pinnable, contrary to two earlier, wrong conclusions below.
  #
  # *** THE PAGINATION TRAP (read this before ever re-deciding this pin) ***
  # Two earlier passes over this file concluded, in turn, that (a) the
  # `postgis` repo published no PG 18 images at all, then (b) that PG 18
  # existed but had "no numeric patch tag to pin to, only floating OS-
  # flavour tags." BOTH were wrong, and both came from the SAME root
  # cause: querying `ghcr.io/v2/cloudnative-pg/postgis/tags/list?n=1000`
  # (or `?n=2000`) and treating the truncated first page as the whole
  # list. GHCR paginates via a `Link: <...>; rel="next"` response header;
  # the real list, fully paged, is 4,359 tags across 5 pages (verified
  # 2026-08-21). Paging all 5 pages surfaces the fully-pinned PG 18 tags
  # that a single-page query simply never sees. If you are about to
  # conclude PG 18 (or any future major) "doesn't have a pinnable tag,"
  # page the ENTIRE list first -- don't trust page 1.
  #
  # Deliberately patch-PINNED per this repo's release-engineering
  # convention: a database operand must not change under a live cluster
  # on an unrelated pod restart. Bump by re-paging the FULL tag list
  # above (all pages) and re-verifying the new tag resolves (manifest
  # GET => 200) before changing this line -- don't just take the newest
  # number on faith, and don't stop at page 1.
  #
  # PG major is 18, PostGIS is 3.6, DELIBERATELY -- final decision,
  # 2026-08-21, made while this cluster was mid-flight on CNPG's own
  # declarative 16->17 major upgrade (see PR history) and still holds
  # zero real rows (no `databases:` CR below has ever been created
  # inside a running cluster, no `-app` secret ever consumed), so the
  # cost of this bump is a second free re-bootstrap, not a pg_upgrade.
  # The `postgis` repo's PG 18 line ONLY EVER shipped on the PostGIS 3.6
  # track -- there is no `18-3.4-*` or `18-3.5-*` tag at any patch, and
  # never has been (verified against the full paginated tag list) -- so
  # taking PG 18 here means taking PostGIS 3.6, not a separate choice.
  # PostGIS 3.4 -> 3.6 compatibility was checked against this cluster's
  # actual usage (delivery-gateway's `20260811231900_postgis_geo`
  # migration: `CREATE EXTENSION IF NOT EXISTS postgis`,
  # `geography(POINT/POLYGON, 4326)`, `ST_MakePoint`, `ST_SetSRID`, a
  # `USING GIST` index) against the PostGIS 3.5 and 3.6 release notes:
  # nothing removed or behaviour-changed in either release touches
  # `ST_MakePoint`/`ST_SetSRID`/`geography`/GIST indexing or a bare
  # `CREATE EXTENSION postgis`. 3.6's breaking changes are a
  # `geometry_columns` constraint-check removal, integer->bigint
  # topology function deprecations, a TIN/PolyhedralSurface
  # `ST_NumGeometries` behaviour change, and removal of
  # `st_approxquantile(raster, ...)` -- none apply here. Since this
  # cluster has zero rows, `CREATE EXTENSION postgis` installs 3.6.4
  # fresh; there's no `postgis_extensions_upgrade()` migration step to
  # run either way.
  #
  # Flavour is `standard`, NOT `system` or `minimal` -- CORRECTING the
  # pattern-match to ../keycloak-ha/values.yaml's `18.1-system-trixie`:
  # `system` images are DEPRECATED upstream (cloudnative-pg/postgres-
  # containers README, 2026-08-21) and exist only to carry the in-image
  # Barman Cloud binary for CNPG's legacy in-core backup path. This
  # chart (like keycloak-ha) does NOT use that path -- both already
  # back up via the separate `barman-cloud.cloudnative-pg.io` Cluster
  # PLUGIN (see `templates/cnpg.yaml`'s `spec.plugins` + the
  # `barmancloud.cnpg.io/v1` ObjectStore), which upstream's own docs
  # state is functionally at parity with `system` and is meant to run
  # against `standard` (or `minimal`) images. So `system-trixie` was
  # never actually required here (or on keycloak-ha) -- `standard`
  # is genuinely the closer-to-recommended, non-deprecated choice, and
  # is what's pinned below. `-trixie` (not `-bookworm`) still matches
  # ../keycloak-ha/values.yaml's Debian codebase choice for this fleet.
  imageName: "ghcr.io/cloudnative-pg/postgis:18.6-3.6.4-202608171012-standard-trixie"
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# Pre-seeds the `vaam` role's password via ESO instead of letting CNPG
# auto-generate one (see the file header above for why). Also the SAME
# object every vaam-store/platform service's own ExternalSecret reads
# `platform_postgres_password` from (database.shared.passwordRemoteProperty)
# -- one shared password, one shared property, no per-service secret.
externalSecret:
  enabled: true
  storeName: ssegning-aws
  storeKind: ClusterSecretStore
  remoteKey: vaam/prod/env
  secretName: vaam-prod-pg-owner
  refreshInterval: 1h
  passwordRemoteProperty: platform_postgres_password
  username: vaam

databases:
  # One CNPG Database CR per vaam-store/platform Postgres-backed service.
  # Owner is the bootstrap user (`vaam`, seeded above); each
  # vaam-store/platform chart's `database.shared.*` values compose its own
  # VAAM_DATABASE_URL against the SAME role, overriding only the database
  # name. `extensions` are created by CNPG as superuser (the `vaam` role
  # can't create untrusted extensions like postgis itself); the CNPG
  # postgis-flavored operand image bundles the libs (see cluster.imageName
  # override note below if you enable extensions).
  - name: auth_db
  - name: catalog_db
    extensions: [postgis]   # catalog 0001_init.sql: CREATE EXTENSION postgis
  - name: delivery_db
    extensions: [postgis]   # delivery 0005_postgis_geo.sql
  - name: order_db
  - name: payment_db
  - name: upload_db
  - name: vendor_db

backup:
  enabled: true
  # barman-cloud target. Bucket must exist on s3.ssegning.me; create with:
  #   mc mb ssegning/vaam-cnpg-backups
  endpoint: https://s3.ssegning.me
  bucket: vaam-cnpg-backups
  path: /vaam-store-prod
  retention: 30d
  schedule: "0 0 3 * * *"   # daily at 03:00

certificates:
  enabled: true
  # Reuses the home-os self-signed-ca ClusterIssuer for Postgres TLS,
  # matching the keycloak-ha pattern.
  issuerName: self-signed-ca
  issuerKind: ClusterIssuer

redis:
  enabled: true
  image: redis:8.6.2-trixie
  replicas: 1
  storageSize: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
