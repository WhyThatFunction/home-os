{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ci-cache-rustfs
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  # Covers the RustFS server plus the provisioning Job. The Job opens no
  # ports, so the ingress rule below remains an effective deny for it.
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Deliberately open to any namespace on these two ports: the consumers
    # are ARC runner pods spread across the many `gh-runners-*` namespaces
    # plus turbo-cache, all on this same cluster.
    - ports:
        - port: 9000
          protocol: TCP
        - port: 9001
          protocol: TCP
  # RustFS and the provisioning Job need DNS/API egress within the cluster.
  egress:
    - {}
{{- end }}
