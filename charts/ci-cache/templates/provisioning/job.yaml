{{- with .Values.provisioning }}
{{- if .enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: ci-cache-provisioning
  namespace: {{ $.Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: rustfs-provisioning
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service | quote }}
  annotations:
    # A Sync-phase hook at wave 1, NOT PostSync. PostSync deadlocked on the
    # first install: the gha-cache server refuses to start when its bucket
    # is absent ("Failed to initialize storage: Bucket gha-cache does not
    # exist"), so the Deployment never went Healthy, so the sync operation
    # never completed, so the PostSync hook that would have CREATED the
    # bucket never ran. Circular, and it self-heals into a CrashLoopBackOff
    # that looks like an application fault rather than an ordering one.
    #
    # Sync-phase hooks participate in sync-wave ordering, so this now runs
    # after wave 0 (RustFS + the registry caches) is Healthy and before
    # wave 2 (gha-cache), which is the only consumer that needs its bucket
    # to pre-exist. The retry loop below still waits for RustFS readiness
    # independently, so the wave ordering is belt-and-braces rather than
    # the sole guarantee.
    #
    # This Job guarantees ORDERING on a first install; it does not guarantee
    # the buckets stay in existence afterwards. If the RustFS PVC is later
    # replaced while the Application is already Synced, no manifest changes,
    # so ArgoCD performs no sync, so this hook never re-runs — every bucket
    # is silently gone with nothing to trigger their recreation. That gap is
    # what provisioning/cronjob.yaml closes: it runs the identical script
    # (shared via _helpers.tpl, not copy-pasted) on a schedule, as the
    # continuous reconciler for an invariant no Kubernetes controller
    # watches. Keep both — a CronJob's schedule cannot promise "before wave
    # 2" the way a Sync-phase hook can, and this hook cannot heal a bucket
    # lost outside of a sync.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "1"
    # Keep the last successful Job as provisioning evidence; the next sync
    # replaces it and reruns the idempotent provisioning contract.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  template:
    {{- include "ci-cache.provisioning.podTemplate" $ | nindent 4 }}
{{- end }}
{{- end }}
