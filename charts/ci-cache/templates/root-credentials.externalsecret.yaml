{{- if .Values.rootSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.rootSecret.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  annotations:
    # ArgoCD has a built-in health check for ExternalSecret. An earlier wave
    # makes Argo wait for the Secret to exist before the RustFS Deployment
    # (wave 0) tries to mount it — otherwise the first sync CrashLoops until
    # ESO catches up.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.rootSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.rootSecret.store.name | quote }}
    kind: {{ .Values.rootSecret.store.kind | quote }}
  target:
    name: {{ .Values.rootSecret.name | quote }}
    creationPolicy: Owner
  data:
    # These two key names must be exactly `root-user` and `root-password`
    # because values.yaml's `rustfs.extraEnv` secretKeyRefs reference them.
    - secretKey: root-user
      remoteRef:
        key: {{ .Values.rootSecret.remoteKey | quote }}
        property: {{ .Values.rootSecret.accessKeyProperty | quote }}
    - secretKey: root-password
      remoteRef:
        key: {{ .Values.rootSecret.remoteKey | quote }}
        property: {{ .Values.rootSecret.secretKeyProperty | quote }}
{{- end }}
