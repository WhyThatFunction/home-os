rustfs:
  fullnameOverride: rustfs
  replicaCount: 1

  image:
    rustfs:
      repository: rustfs/rustfs
      pullPolicy: IfNotPresent
      tag: "1.0.0-rc.5@sha256:c36b3efea3d1e503f1a2581abd0e7611e0e5820dd30e1850a52384b3fc52bda4"
    initImage:
      repository: busybox
      pullPolicy: IfNotPresent
      tag: "1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0"

  mode:
    standalone:
      enabled: true
      strategy:
        # Never mount the reused RWO claim from two object-storage processes.
        type: Recreate
      existingClaim:
        dataClaim: s3-minio
        logsClaim: ""
    distributed:
      enabled: false

  # `minio-root` is owned by the separate home-secrets repository. Explicit
  # mappings let RustFS reuse it without changing its legacy key names.
  secret:
    existingSecret: minio-root
  extraEnv:
    - name: RUSTFS_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: minio-root
          key: root-user
    - name: RUSTFS_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: minio-root
          key: root-password
    - name: RUSTFS_VOLUMES
      value: /data

  config:
    rustfs:
      address: ":9000"
      console_enable: "true"
      console_address: ":9001"
      log_level: info
      region: us-east-1
      # Keep logs on stdout; the NAS-backed standalone instance needs no
      # second persistent log volume.
      obs_log_directory: ""
      obs_environment: production
      # `sstorage` is an NFS mount from the NAS, not a local block device.
      # Use RustFS's built-in higher-latency drive timeout profile.
      timeout_profile: high_latency

  # The reused NFS files are owned by Bitnami MinIO's UID/GID. Keeping 1001
  # avoids a recursive chown that root-squashed NFS may reject.
  podSecurityContext:
    fsGroup: 1001
    runAsUser: 1001
    runAsGroup: 1001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001

  service:
    type: ClusterIP
    endpoint:
      port: 9000
    console:
      port: 9001

  # The upstream ingress targets only the console. Parent-chart ingresses keep
  # the existing S3 API and admin hostnames stable.
  ingress:
    enabled: false

  serviceAccount:
    create: true
    automount: false

  enableServiceLinks: false

  storageclass:
    name: sstorage
    dataStorageSize: 200Gi
    logStorageSize: 1Gi

publicIngress:
  enabled: true
  className: traefik
  clusterIssuer: cert-cloudflare
  api:
    hosts:
      - s3.ssegning.me
      - s3.camer.digital
      - cdn.vaam.store
    # Preserve the existing certificate scope. The two additional hosts were
    # routed by the old chart but were not SANs on this certificate.
    tlsHosts:
      - s3.ssegning.me
    tlsSecret: s3.ssegning.me-tls
  console:
    host: s3-admin.ssegning.me
    tlsSecret: s3-admin.ssegning.me-tls

rustfsProvisioning:
  enabled: true
  image:
    repository: rustfs/rc
    tag: "v0.1.34@sha256:fad686174251b22de1e7b11438b3389932c93d2043c4eec981e1168c59edf92f"
    pullPolicy: IfNotPresent
  endpoint: http://rustfs-svc:9000
  rootSecret:
    name: minio-root
    accessKeyKey: root-user
    secretKeyKey: root-password
  # These Secrets contain Bitnami-style credential records. `minio-users`
  # remains until its source in the separate home-secrets repo is renamed.
  userSecrets:
    - minio-users
    - vaam-rustfs-users
    - artifact-cache-users
    - ssegning-rustfs-users

  policies:
    - name: monitoring-policy
      statements:
        - actions: ["s3:*"]
          effect: Allow
          resources:
            - arn:aws:s3:::monitoring
            - arn:aws:s3:::monitoring/*
            - arn:aws:s3:::monitoring-loki-ruler
            - arn:aws:s3:::monitoring-loki-ruler/*
            - arn:aws:s3:::monitoring-loki-chunks
            - arn:aws:s3:::monitoring-loki-chunks/*
            - arn:aws:s3:::monitoring-tempo
            - arn:aws:s3:::monitoring-tempo/*
    - name: lakefs-policy
      statements:
        - actions: ["s3:*"]
          effect: Allow
          resources: ["arn:aws:s3:::lakefs", "arn:aws:s3:::lakefs/*"]
    - name: argo-workflow-policy
      statements:
        - actions: ["s3:*"]
          effect: Allow
          resources: ["arn:aws:s3:::argo-artifacts", "arn:aws:s3:::argo-artifacts/*"]
    - name: mlflow-policy
      statements:
        - actions: ["s3:*"]
          effect: Allow
          resources: ["arn:aws:s3:::mlflow", "arn:aws:s3:::mlflow/*"]
    - name: ai-ops-backups-policy
      statements:
        - actions: ["s3:*"]
          effect: Allow
          resources: ["arn:aws:s3:::ai-ops-backups", "arn:aws:s3:::ai-ops-backups/*"]
    - name: azamra-s3-policy
      statements:
        - actions: ["s3:*"]
          effect: Allow
          resources: ["arn:aws:s3:::azamra-gitops", "arn:aws:s3:::azamra-gitops/*"]
    - name: vymalo-cnpg-backups-policy
      statements:
        - actions:
            - s3:GetBucketLocation
            - s3:ListBucket
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          effect: Allow
          resources:
            - arn:aws:s3:::vymalo-cnpg-backups
            - arn:aws:s3:::vymalo-cnpg-backups/*
    - name: vaam-apps-policy
      statements:
        - actions:
            - s3:GetBucketLocation
            - s3:ListBucket
            - s3:ListBucketMultipartUploads
          effect: Allow
          resources:
            - arn:aws:s3:::vaam-media
            - arn:aws:s3:::vaam-cnpg-backups
        - actions:
            - s3:AbortMultipartUpload
            - s3:DeleteObject
            - s3:DeleteObjectVersion
            - s3:GetObject
            - s3:GetObjectAttributes
            - s3:GetObjectTagging
            - s3:GetObjectVersion
            - s3:ListMultipartUploadParts
            - s3:PutObject
            - s3:PutObjectTagging
          effect: Allow
          resources:
            - arn:aws:s3:::vaam-media/*
            - arn:aws:s3:::vaam-cnpg-backups/*
        # Map releases are published by an operator credential. The runtime
        # application may read them, but an explicit deny prevents accidental
        # overwrite or deletion even though it owns the rest of vaam-media.
        - actions:
            - s3:AbortMultipartUpload
            - s3:DeleteObject
            - s3:DeleteObjectTagging
            - s3:DeleteObjectVersion
            - s3:PutObject
            - s3:PutObjectTagging
          effect: Deny
          resources:
            - arn:aws:s3:::vaam-media/maps/*
    - name: ssegning-policy
      statements:
        - actions: ["s3:*"]
          effect: Allow
          resources:
            - arn:aws:s3:::ssegning-uploads
            - arn:aws:s3:::ssegning-uploads/*
            - arn:aws:s3:::ssegning-cnpg-backups
            - arn:aws:s3:::ssegning-cnpg-backups/*
    - name: artifact-cache-policy
      statements:
        - actions: ["s3:*"]
          effect: Allow
          resources:
            - arn:aws:s3:::turbo-cache
            - arn:aws:s3:::turbo-cache/*
            - arn:aws:s3:::sc-cache
            - arn:aws:s3:::sc-cache/*
            - arn:aws:s3:::mobile-store
            - arn:aws:s3:::mobile-store/*

  buckets:
    - monitoring
    - lakefs
    - mlflow
    - argo-artifacts
    - ai-ops-backups
    - azamra-gitops
    - vymalo-cnpg-backups
    - vymalo-catalog
    - vymalo-uploads
    - vymalo-insights
    - vaam-cnpg-backups
    - vaam-media
    - turbo-cache
    - sc-cache
    - mobile-store
    - ssegning-uploads
    - ssegning-cnpg-backups

  anonymousPolicies:
    - bucket: lakefs
      policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: ["*"]}
            Action: [s3:GetObject]
            Resource: ["arn:aws:s3:::lakefs/public/*"]
    - bucket: ai-ops-backups
      policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: ["*"]}
            Action: [s3:GetObject]
            Resource: ["arn:aws:s3:::ai-ops-backups/public/*"]
    - bucket: ssegning-uploads
      policy:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {AWS: ["*"]}
            Action: [s3:GetObject]
            Resource: ["arn:aws:s3:::ssegning-uploads/*"]
