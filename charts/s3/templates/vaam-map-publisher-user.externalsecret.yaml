# Dedicated immutable-map publisher. The ordinary vaam-apps user has an
# explicit maps/* write deny; this identity can create/read objects under the
# maps prefix but has no list/delete permission and no access outside it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaam-map-publisher-users
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/part-of: rustfs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: vaam-map-publisher-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        vaam-map-publisher: |
          username={{ `{{ .map_publisher_access_key }}` }}
          password={{ `{{ .map_publisher_secret_key }}` }}
          disabled=false
          policies=vaam-map-publisher-policy
  data:
    - secretKey: map_publisher_access_key
      remoteRef:
        key: vaam-apps/prod/env
        property: map_publisher_access_key
    - secretKey: map_publisher_secret_key
      remoteRef:
        key: vaam-apps/prod/env
        property: map_publisher_secret_key
