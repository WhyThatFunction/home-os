apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaam-rustfs-users
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: vaam-rustfs-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        vaam-store-user: |
          username={{ `{{ .access }}` }}
          password={{ `{{ .secret }}` }}
          disabled=false
          policies=vaam-store-policy
  data:
    - secretKey: access
      remoteRef:
        key: vaam/prod/env
        property: upload_service_object_storage_access_key
    - secretKey: secret
      remoteRef:
        key: vaam/prod/env
        property: upload_service_object_storage_secret_key
