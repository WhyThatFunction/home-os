# RustFS user for the vaam-apps production stack (media uploads + CNPG
# barman-cloud backups).
#
# The provisioning Job reads each Secret key as one key=value user record.
# The double-brace escape is required so Helm emits a literal external-secrets
# expression rather than trying to resolve `.access` itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaam-rustfs-users
  namespace: {{ .Release.Namespace | quote }}
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: vaam-rustfs-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        vaam-apps-user: |
          username={{ `{{ .access }}` }}
          password={{ `{{ .secret }}` }}
          disabled=false
          policies=vaam-apps-policy
  data:
    - secretKey: access
      remoteRef:
        key: vaam-apps/prod/env
        property: s3_access_key
    - secretKey: secret
      remoteRef:
        key: vaam-apps/prod/env
        property: s3_secret_key
