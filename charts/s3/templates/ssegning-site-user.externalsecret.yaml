# MinIO user for the ssegning.com website (Strapi 5 media uploads).
#
# Same shape as vaam-store-user.externalsecret.yaml: the bitnami MinIO chart's
# `provisioning.usersExistingSecrets` reads each Secret KEY as one user, whose
# VALUE is a `key=value` block. The double-brace escape (`{{ ` ... ` }}`) is
# required so Helm emits a literal external-secrets template expression rather
# than trying to resolve `.access` itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ssegning-minio-users
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels:
    {{ include "common.labels.standard" $ | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: ssegning-minio-users
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ssegning-site-user: |
          username={{ `{{ .access }}` }}
          password={{ `{{ .secret }}` }}
          disabled=false
          policies=ssegning-policy
  data:
    - secretKey: access
      remoteRef:
        key: ssegning/prod/env
        property: s3_access_key
    - secretKey: secret
      remoteRef:
        key: ssegning/prod/env
        property: s3_secret_key
