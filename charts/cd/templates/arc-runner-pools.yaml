{{- range .Values.arcRunnerPools }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .name }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: arc-runner
  sources:
    {{ if .enableRunner }}
    - repoURL: "oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set"
      targetRevision: "0.*"
      chart: "."
      helm:
        releaseName: {{ .releaseName }}
        valuesObject:
          githubConfigUrl: {{ .githubConfigUrl }}
          githubConfigSecret: gh-runner-secret-pat
          runnerScaleSetName: {{ .runnerScaleSetName }}
          runnerGroup: {{ .runnerGroup }}
          {{- with .scaleSetLabels }}
          scaleSetLabels:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          maxRunners: {{ .maxRunners }}
          minRunners: 0

          controllerServiceAccount:
            namespace: arc-systems
            name: arc-gha-rs-controller

          template:
            spec:
              {{- if .priorityClass }}
              priorityClassName: {{ .releaseName }}
              {{- end }}

              securityContext:
                fsGroup: 1001
              imagePullSecrets:
                - name: ghcr-pull-secret
              containers:
                - name: runner
                  # vymalo/arc-runners#1 — rootless buildah/podman/yq + the baked
                  # toolchain the sse jobs need (yq for flutter-action, sccache, …).
                  # Replaces the stock actions-runner image, which had no yq (the
                  # mobile-ci "yq not found" failure) and no container tooling for
                  # the migrated buildah/podman jobs.
                  image: ghcr.io/vymalo/arc-runners:jdk21-node22
                  # moving tag → force a fresh pull each pod (K8s defaults non-:latest to IfNotPresent)
                  imagePullPolicy: Always
                  # The gha-runner-scale-set chart only injects the default
                  # `command: [/home/runner/run.sh]` on its own default runner
                  # container. Overriding `template.spec.containers` replaces
                  # that list wholesale, so without an explicit command the
                  # stock actions-runner image runs its no-op default CMD,
                  # exits 0 in <1s, and the JIT-registered runner never comes
                  # online — leaving queued jobs unserved and the listener
                  # churning replacements forever. Mirror sky-frontend.
                  #
                  # sccache preflight (verified against the real RustFS with
                  # sccache 0.16.0, real creds): `sccache --start-server`
                  # exits 0 when the S3 bucket is reachable and exits 2 with
                  # "NoSuchBucket" when it is missing — and when it can't
                  # start, rustc cannot run AT ALL (RUSTC_WRAPPER points at a
                  # dead wrapper), so the whole job fails instead of just
                  # losing its cache. Confirmed today in vaam-apps: `sccache:
                  # error: Server startup failed: cache storage failed to
                  # read: ... NoSuchBucket` -> exit code 101 killed `rust` and
                  # `rust-live`. The multi-level disk+s3 chain does NOT help
                  # here — it still exits 2 on a missing bucket because this
                  # failure is at read/init during startup, not at write, so
                  # the chain's write-error policy never gets a chance to
                  # apply.
                  #
                  # We probe with sccache itself, not a TCP/HTTP reachability
                  # check against the endpoint: a plain connectivity probe
                  # would have passed during today's incident, since the
                  # endpoint was up and only the bucket was missing. Only
                  # exercising the exact failing operation catches that.
                  # `timeout 30` bounds a hung endpoint so it degrades to
                  # uncached instead of wedging pod startup — this must always
                  # fail toward "build without cache", never toward "pod
                  # never starts". On failure we `unset RUSTC_WRAPPER` in this
                  # shell: that removes it from the environment `exec
                  # /home/runner/run.sh` inherits, and job steps in turn
                  # inherit the runner process's environment, so this is the
                  # entire mechanism by which the job stops invoking sccache
                  # and falls back to plain rustc. `exec` at the end keeps
                  # run.sh as PID 1 so the runner's lifecycle/signal handling
                  # is unchanged. Known limitation: the health/warning line
                  # below lands in the pod log (`kubectl logs`), not the
                  # GitHub Actions job log, so a silently-uncached build is
                  # only visible via kubectl, not in the Actions UI.
                  command: [ "/bin/sh", "-c" ]
                  args:
                    - |
                      if command -v sccache >/dev/null 2>&1 && [ -n "${RUSTC_WRAPPER}" ]; then
                        if timeout 30 sccache --start-server >/dev/null 2>&1; then
                          # Stop the probe's own server again so this stays a pure predicate
                          # with no side effects. Left running, it would be pinned to the
                          # POD's SCCACHE_* config, and a job overriding any of those in its
                          # own steps would silently keep talking to the pod-configured
                          # backend instead. Stopping restores exactly the behaviour before
                          # this change: the job starts the server lazily, with its own env.
                          # --stop-server is asynchronous: measured in the runner image,
                          # the process is still present immediately after it returns and
                          # gone within 3s. Harmless here - runner startup and job dispatch
                          # take far longer than that, so the job's first sccache call
                          # always starts a fresh server.
                          sccache --stop-server >/dev/null 2>&1 || true
                          echo "[sccache-preflight] compile cache is healthy; using RUSTC_WRAPPER=${RUSTC_WRAPPER}"
                        else
                          echo "[sccache-preflight] WARNING: Rust compile cache (sccache) is unreachable; building UNCACHED. This is deliberate and slower, not a failure."
                          unset RUSTC_WRAPPER
                        fi
                      fi
                      exec /home/runner/run.sh
                  {{- $profileName := .resourceProfile | default "standard" }}
                  {{- $profile := index $.Values.arcRunnerResourceProfiles $profileName }}
                  {{- $reqs := .resourceRequests | default $profile }}
                  resources:
                    requests:
                      cpu: {{ $reqs.cpu | quote }}
                      memory: {{ $reqs.memory | quote }}
                    limits:
                      cpu: {{ $profile.cpu | quote }}
                      memory: {{ $profile.memory | quote }}
                  env:
                    # Rootless container build/run (buildah/podman) with no
                    # /dev/fuse or userns: vfs storage + chroot isolation.
                    - name: STORAGE_DRIVER
                      value: vfs
                    - name: BUILDAH_ISOLATION
                      value: chroot
                    # cargo/rustc (and make -j, nproc) read the HOST cpu count
                    # (8 on these nodes), NOT the cgroup cpu limit — so cargo
                    # defaults to -j8 and 8 parallel rustc blow past the 8Gi limit
                    # → cgroup OOMKill ("cargo builds destroyed"). Pin parallelism
                    # to the cpu allotment so peak memory stays well under 8Gi.
                    - name: CARGO_BUILD_JOBS
                      value: {{ $profile.cpu | quote }}
                    # CI gets no benefit from incremental and it inflates peak
                    # memory + disk; off is the CI norm.
                    - name: CARGO_INCREMENTAL
                      value: "0"
                    - name: RUSTC_WRAPPER
                      value: "sccache"
                    - name: RUNNER_TOOL_CACHE
                      value: /opt/hostedtoolcache
                    - name: SCCACHE_BUCKET
                      value: {{ $.Values.arcRunnerCache.sccacheBucket }}
                    - name: SCCACHE_REGION
                      value: auto
                    # These now resolve to ClusterIP Services in the ci-cache
                    # namespace on this same netcup-k8s cluster (see
                    # arcRunnerCache in values.yaml) - plaintext is a pod-to-
                    # pod hop inside the CNI, not a public egress, and SSL is
                    # off because nothing terminates TLS in front of these
                    # Services on purpose.
                    - name: SCCACHE_S3_USE_SSL
                      value: "false"
                    - name: SCCACHE_ENDPOINT
                      value: {{ $.Values.arcRunnerCache.s3Endpoint }}
                    - name: TURBO_API
                      value: {{ $.Values.arcRunnerCache.turboApi }}
                    - name: TURBO_TEAM
                      value: {{ .turboTeam }}
                    - name: TURBO_TOKEN
                      valueFrom: { secretKeyRef: { name: arc-runner-secrets, key: turbo-token } }
                    - name: SCCACHE_S3_ACCESS_KEY_ID
                      valueFrom: { secretKeyRef: { name: arc-runner-secrets, key: access-key-id } }
                    - name: SCCACHE_S3_SECRET_ACCESS_KEY
                      valueFrom: { secretKeyRef: { name: arc-runner-secrets, key: secret-access-key } }
                    # Credentials AWS_ENDPOINT_URL[_S3] below authenticate
                    # with - the same prod/artifact-cache/env identity the
                    # turbo-cache server itself uses.
                    - name: AWS_ACCESS_KEY_ID
                      valueFrom: { secretKeyRef: { name: arc-runner-secrets, key: access-key-id } }
                    - name: AWS_SECRET_ACCESS_KEY
                      valueFrom: { secretKeyRef: { name: arc-runner-secrets, key: secret-access-key } }
                    - name: AWS_REGION
                      value: {{ $.Values.arcRunnerCache.s3Region }}
                    - name: AWS_DEFAULT_REGION
                      value: {{ $.Values.arcRunnerCache.s3Region }}
                    # Makes an *unconfigured* S3 client (a job that just runs
                    # `aws s3 cp` or uses an SDK with no explicit endpoint)
                    # default to the in-cluster RustFS instead of AWS.
                    #
                    # ONLY the service-specific name. The generic
                    # AWS_ENDPOINT_URL is service-AGNOSTIC: it redirects
                    # every AWS client - sts, ecr, dynamodb, sqs - at this
                    # address, so an unrelated `aws ecr get-login-password`
                    # in some job would stop reaching AWS and instead get an
                    # opaque S3 XML error back from RustFS. An earlier
                    # revision set both and justified it as covering "older
                    # tooling"; that was wrong - the generic and the
                    # service-specific variables shipped in the same SDK
                    # release, so there is no tool that reads one and not the
                    # other, and nothing is lost by omitting the generic one.
                    - name: AWS_ENDPOINT_URL_S3
                      value: {{ $.Values.arcRunnerCache.s3EndpointUrl }}
                    # RustFS needs this: newer AWS SDKs default to sending/
                    # validating CRC32 checksum trailers that it rejects.
                    # CLAUDE.md already records `when_required` as a verified
                    # requirement for talking to this RustFS - it's set the
                    # same way on the OpenObserve awss3 exporter.
                    - name: AWS_REQUEST_CHECKSUM_CALCULATION
                      value: when_required
                    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                      value: when_required
                    # A documented default bucket name jobs can use for build
                    # outputs without hardcoding one; created by charts/ci-cache.
                    - name: CI_ARTIFACTS_BUCKET
                      value: {{ $.Values.arcRunnerCache.artifactsBucket }}
                    # Redirects `actions/cache` (and setup-node's npm/pnpm
                    # cache, Gradle, pip, pub) at the in-cluster cache
                    # server instead of GitHub. Inert unless the runner
                    # image carries the Runner.Worker.dll patch - the stock
                    # runner overwrites this variable from the job context,
                    # so an unpatched image silently ignores it and keeps
                    # caching to GitHub. See arcRunnerCache.ghaCacheUrl in
                    # values.yaml for the full story and why that failure
                    # mode is silent.
                    - name: ACTIONS_RESULTS_URL
                      value: {{ $.Values.arcRunnerCache.ghaCacheUrl | quote }}
                  securityContext:
                    runAsUser: 1001
                    runAsGroup: 1001
                    # The Hetzner runner nodes block unprivileged userns uid_map
                    # writes, so rootless buildah/podman can't map subuids for a
                    # `podman run` — and a NON-privileged pod can't be made to (a
                    # shared host userns EPERMs newuidmap's multi-range map; a
                    # hostUsers:false pod's fixed 65536-uid namespace has no room for
                    # a subuid range, so image extraction dies on /etc/shadow). See
                    # home-os#106/#107. `privileged` runs the inner container without
                    # id-shifting, which is the reliable fix for podman-run jobs.
                    # (A CI runner already executes arbitrary job code.)
                    #
                    # privileged ALREADY grants all capabilities, disables
                    # no_new_privs, and runs unconfined by AppArmor + seccomp — so no
                    # allowPrivilegeEscalation / capabilities.add / appArmorProfile is
                    # needed here (verified end-to-end: bare `privileged: true` runs
                    # `podman run postgres:17-alpine` fine, AppArmor `unconfined`).
                    privileged: true
                  volumeMounts:
                    - name: work
                      mountPath: /home/runner/_work
                    - name: tool-cache
                      mountPath: /opt/hostedtoolcache
                    # rootless graphroot for buildah/podman image storage
                    - name: containers
                      mountPath: /home/runner/.local/share/containers
                    # /etc/containers/registries.conf already EXISTS in the
                    # ghcr.io/actions/actions-runner base image (verified:
                    # 3799 bytes) - mount only this one file via subPath
                    # instead of the whole /etc/containers dir, which would
                    # shadow storage.conf/containers.conf that the image
                    # writes itself and that podman/buildah need.
                    - name: containers-registries-conf
                      mountPath: /etc/containers/registries.conf
                      subPath: registries.conf
                      readOnly: true
              volumes:
                - name: work
                  emptyDir: { }
                - name: tool-cache
                  emptyDir: { }
                - name: containers
                  emptyDir: { sizeLimit: {{ .containersSizeLimit }} }
                - name: containers-registries-conf
                  configMap:
                    name: {{ .releaseName }}-registries-conf
    {{- end }}

    - repoURL: https://bjw-s-labs.github.io/helm-charts
      targetRevision: "4.*"
      chart: app-template
      helm:
        valuesObject:
          rawResources:
            auth-secret:
              enabled: true
              apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              spec:
                spec:
                  refreshInterval: 0h10m0s
                  secretStoreRef:
                    name: ssegning-aws
                    kind: ClusterSecretStore
                  target:
                    name: gh-runner-secret-pat
                    creationPolicy: Owner
                  data:
                    - secretKey: github_token
                      remoteRef:
                        key: "prod/meta/test-app"
                        property: github_token
            arc-runner-secrets:
              enabled: true
              apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              spec:
                spec:
                  refreshInterval: 0h10m0s
                  secretStoreRef:
                    name: ssegning-aws
                    kind: ClusterSecretStore
                  target:
                    name: arc-runner-secrets
                    creationPolicy: Owner
                  data:
                    - secretKey: turbo-token
                      remoteRef:
                        key: "prod/artifact-cache/env"
                        property: turbo_token
                    - secretKey: access-key-id
                      remoteRef:
                        key: "prod/artifact-cache/env"
                        property: object_storage_access_key
                    - secretKey: secret-access-key
                      remoteRef:
                        key: "prod/artifact-cache/env"
                        property: object_storage_secret_key
            gh-pull-token:
              enabled: true
              apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              spec:
                spec:
                  refreshInterval: 0h10m0s
                  secretStoreRef:
                    name: ssegning-aws
                    kind: ClusterSecretStore
                  target:
                    name: ghcr-pull-secret
                    creationPolicy: Owner
                    template:
                      engineVersion: v2
                      type: kubernetes.io/dockerconfigjson
                      data:
                        .dockerconfigjson: |
                          {{- $.Values.arcRunnerGhcrDockerconfigTemplate | nindent 26 }}
                  data:
                    - secretKey: github_username
                      remoteRef:
                        key: "prod/meta/test-app"
                        property: github_username
                    - secretKey: github_token
                      remoteRef:
                        key: "prod/meta/test-app"
                        property: github_token
                    - secretKey: github_email
                      remoteRef:
                        key: "prod/meta/test-app"
                        property: github_email

            # Podman/buildah pull-through mirror config, replacing the
            # registries.conf that already EXISTS inside the
            # ghcr.io/actions/actions-runner base image (3799 bytes) via the
            # subPath volumeMount above, so every image pull on the runner
            # goes through the caches in charts/ci-cache by default - no
            # runner-image change, and nothing for a workflow to opt into.
            # short-name-mode = "permissive" is set explicitly because the
            # enforcing default prompts interactively for an unqualified
            # image ref (e.g. `alpine:3.20`), which just hangs a CI job
            # instead of failing or resolving one. A mirror miss (cache down,
            # or an image the mirror doesn't have) falls back automatically
            # to the upstream `location` below, so this degrades to today's
            # direct-pull behaviour rather than breaking builds.
            # forceRename (not `name`, per CLAUDE.md's bjw-s rawResource
            # gotcha) gives this ConfigMap a predictable name so the volume
            # below can reference it directly.
            containers-registries-conf:
              enabled: true
              forceRename: {{ .releaseName }}-registries-conf
              apiVersion: v1
              kind: ConfigMap
              spec:
                data:
                  registries.conf: |
                    unqualified-search-registries = ["docker.io"]
                    short-name-mode = "permissive"
                    {{- range $.Values.arcRunnerCache.registryMirrors }}

                    [[registry]]
                    prefix = "{{ .upstream }}"
                    location = "{{ .upstream }}"

                      [[registry.mirror]]
                      location = "{{ .mirror }}"
                      insecure = true
                    {{- end }}

    {{- if .priorityClass }}
    - repoURL: https://bjw-s-labs.github.io/helm-charts
      targetRevision: "5.*"
      chart: app-template
      helm:
        valuesObject:
          rawResources:
            priority-class:
              enabled: true
              forceRename: {{ .releaseName }}
              manifest:
                apiVersion: scheduling.k8s.io/v1
                kind: PriorityClass
                value: {{ .priorityClass }}
                globalDefault: false
                preemptionPolicy: PreemptLowerPriority
    {{- end }}

  destination:
    name: {{ .destinationCluster }}
    namespace: {{ .namespace }}
  syncPolicy:
    {{- if .managedNamespacePrivileged }}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
{{- end }}
