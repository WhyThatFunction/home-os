# ArgoCD repository credential for the private OCI Helm registry
# `ghcr.io/vymalo/charts`, which hosts the turbo-cache chart consumed by the
# `turbo-cache-netcup` Application in charts/cd-ci/values.yaml.
#
# WHY THIS EXISTS: that package is PRIVATE. Verified directly - an anonymous
# ghcr token returns 403 for both
#   GET /v2/vymalo/charts/turbo-cache/tags/list
#   GET /v2/vymalo/charts/turbo-cache/manifests/<tag>
# so without a credential the repo-server cannot render the chart at all and
# the Application reports:
#   ComparisonError: Failed to load target state: ... unable to get tags:
#   response status code 401: unauthorized: authentication required
#
# That failure is quiet in a nasty way: an Application that cannot render its
# source shows `Sync Status: Unknown` but `Health: Healthy`, because Argo has
# no desired state to compare against and no resources of its own to call
# unhealthy. It looks fine on the dashboard while deploying nothing. The
# previous home-remote `turbo-cache` Application sat in exactly that state -
# its pods survived only because Argo could not compute a diff and therefore
# never pruned them.
#
# Shape and source mirror the existing `converse-frontends-charts-oci` and
# `adorsys-gis-charts-oci-repo` credentials already present in this namespace
# (both ExternalSecrets over the same ClusterSecretStore), and reuse the same
# `prod/meta/test-app` GitHub identity that arc-runner-pools.yaml already uses
# for `ghcr-pull-secret`. The double-brace escape keeps the expression literal
# through Helm so external-secrets' own engine resolves it at Secret-creation
# time.
#
# `url` must match the Application's `repoURL` for ArgoCD to select this
# credential - `ghcr.io/vymalo/charts`, with the chart name supplied
# separately by `chart: turbo-cache`. A `repository`-type credential is
# matched by EXACT url (a `repo-creds`-type one matches by prefix), so this
# covers every chart reached as repoURL `ghcr.io/vymalo/charts` + `chart:
# <name>` and nothing deeper.
#
# SUPERSEDES serverless/k/vymalo-shop/argocd-charts-oci-repo.externalsecret.yaml,
# removed in the same change. That file declared the same ExternalSecret name,
# the same target Secret name and the same url, also with creationPolicy:
# Owner - two controllers writing one Secret on different refresh intervals
# had this directory ever been deployed. It never was: nothing in charts/apps
# or charts/cd references serverless/k/vymalo-shop. Because both claimed the
# same exact url, renaming one would not have resolved the ambiguity; only
# having a single credential does.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vymalo-charts-oci-repo
  namespace: {{ .Release.Namespace | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: vymalo-charts-oci-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: helm
        enableOCI: "true"
        name: vymalo-charts
        url: ghcr.io/vymalo/charts
        # Quoted: unquoted, the rendered `{{ .x }}` parses as a YAML flow map.
        username: "{{ `{{ .github_username }}` }}"
        password: "{{ `{{ .github_token }}` }}"
  data:
    - secretKey: github_username
      remoteRef:
        key: "prod/meta/test-app"
        property: github_username
    - secretKey: github_token
      remoteRef:
        key: "prod/meta/test-app"
        property: github_token
