  - name: ai-apps-v2
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: ai
    source:
      repoURL: https://github.com/ADORSYS-GIS/ai-helm
      # Continuous delivery (ai-helm ADR-0055): the root tracks `main`, not an
      # immutable release tag. Migrated apps (OCI `chart:` / external / values-repo
      # sources) float on every merge; not-yet-migrated apps still render at their
      # own self-ref tag pin (release-2026.06.22-v02) baked into main's charts —
      # stable until each is migrated. Retires the tag-cut + repoint dance.
      # Rollback: pin this back to release-2026.06.22-v02 (or any prior tag).
      targetRevision: main
      path: charts/apps
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

# Shared byte-for-byte across all 4 arcRunnerPools below. Deliberately NOT
# templated here (this is a values file, not a template) - the
# `{{ `{{ .github_x }}` }}` text must survive untouched by this chart's own
# Helm pass and land as single-braced {{ .github_x }} after the bjw-s
# app-template chart's `tpl` call, for external-secrets' own template engine
# to fill in at Secret-creation time. Referenced verbatim (no further
# templating) from templates/arc-runner-pools.yaml.
arcRunnerGhcrDockerconfigTemplate: |
  {
    "auths": {
      "ghcr.io": {
        "username": "{{ `{{ .github_username }}` }}",
        "password": "{{ `{{ .github_token }}` }}",
        "email": "{{ `{{ .github_email }}` }}",
        "auth": "{{ `{{ printf "%s:%s" .github_username .github_token | b64enc }}` }}"
      }
    }
  }

# Runner container cpu/memory (requests == limits, so a runner is never
# throttled below what it's scheduled for). `standard` is the default every
# pool below gets unless it sets `resourceProfile: high` explicitly - `high`
# is only consumed by a pool that opts in, i.e. used only when requested. A
# pool can override just its scheduling ask with a per-pool `resourceRequests:
# { cpu, memory }` (see vaam-apps-high-runners below): when set, that value
# becomes `resources.requests` while `resources.limits` still comes from the
# profile - Burstable QoS instead of Guaranteed. Omit it and a pool renders
# byte-identical to today (requests == limits, from the profile alone).
arcRunnerResourceProfiles:
  standard:
    cpu: "2"
    memory: 4Gi
  medium:
    cpu: "4"
    memory: 8Gi
  high:
    cpu: "7"
    memory: 12Gi

# All seven arcRunnerPools below run on netcup-k8s (see `destinationCluster`
# on each), so their build caches now live on that same cluster too - these
# are plain cluster-DNS names resolved *inside* netcup-k8s, and cache traffic
# never leaves it. Before this cutover, every pool repeated its own
# `turboApi: https://turbo-cache-api.ai.camer.digital` (a Deployment on the
# separate home-remote/Hetzner cluster) and the template hardcoded
# `SCCACHE_ENDPOINT: s3.ssegning.me` (the RustFS in the separate in-cluster/
# admin@homeos cluster) - meaning every cache read and write on every CI job
# was a public-internet round trip to a *different* cluster from the one
# running the job. Collapsing it into one block also fixes the exact
# "duplicated list goes silently stale" trap CLAUDE.md warns about: with all
# seven pools now sharing one cache, there is no reason for turboApi to be
# repeated seven times.
#
# Plaintext HTTP (no TLS) is deliberate and safe here: the hop is pod-to-pod
# inside the cluster CNI to a ClusterIP Service, not a public egress, which is
# also why SCCACHE_S3_USE_SSL flips to "false" in the template. These names
# are a contract with `charts/ci-cache` (the RustFS + turbo-cache-server
# workloads themselves) and the `turbo-cache-netcup` Application in
# `charts/cd-ci/values.yaml`: the Service names `rustfs-svc`/`turbo-cache` and
# the bucket names below are fixed there, so renaming one side without the
# other silently breaks every runner pool.
arcRunnerCache:
  # sccache takes host[:port] with no scheme and a separate SSL flag.
  s3Endpoint: rustfs-svc.ci-cache.svc.cluster.local:9000
  # The AWS SDKs and anything else S3-aware take a full URL.
  s3EndpointUrl: http://rustfs-svc.ci-cache.svc.cluster.local:9000
  s3Region: us-east-1
  sccacheBucket: sc-cache
  artifactsBucket: build-artifacts
  turboApi: http://turbo-cache.ci-cache.svc.cluster.local:3000

  # Self-hosted GitHub Actions cache server (charts/ci-cache), so
  # `actions/cache` - and therefore setup-node's npm/pnpm cache, Gradle,
  # pip and pub - stores to the in-cluster RustFS instead of egressing to
  # GitHub on a job that is already running here.
  #
  # MUST end with a trailing slash; the runner treats it as a base URL.
  #
  # This only takes effect on a runner image carrying the Runner.Worker.dll
  # patch: `actions/cache` v4.2+ uses Cache Service v2 via
  # ACTIONS_RESULTS_URL, and the stock runner OVERWRITES that variable from
  # the job context, so setting it on the pod is silently ignored. The
  # vymalo/arc-runners image renames the UTF-16LE string
  # `ACTIONS_RESULTS_URL` to `ACTIONS_RESULTS_ORL` inside the binary so the
  # externally-set value survives, and asserts at build time that the patch
  # applied - because the upstream project's own pre-patched image shipped
  # it missing from the compiled DLL for three releases
  # (falcondev-oss/github-actions-cache-server#265), turning the whole
  # thing into a silent no-op.
  #
  # ORDERING: this value and the image patch are independently inert - the
  # env var does nothing without the patch, and the patch does nothing
  # without the env var - so the two changes can land in either order. The
  # cache goes live when both are in place; until then `actions/cache`
  # keeps talking to GitHub exactly as it does today. The runner image is
  # consumed via the moving tag `:jdk21-node22` with
  # `imagePullPolicy: Always`, so no tag bump is needed here once the
  # patched image is published.
  ghaCacheUrl: http://gha-cache.ci-cache.svc.cluster.local:3000/

  # Container-registry pull-through caches (charts/ci-cache). Mounted into
  # every runner pod as /etc/containers/registries.conf so podman/buildah
  # pull through them by default. Runner pods are ephemeral and
  # STORAGE_DRIVER=vfs copies every layer rather than sharing it with other
  # pods, so without a mirror every job re-downloads its base images from
  # the public internet; and Docker Hub's anonymous pull limit is per
  # source IP, which the netcup nodes share across up to ~40 concurrent
  # runners. Measured locally: cold `alpine:3.20` pull 41.2s, warm through
  # the cache 3.0s.
  #
  # These names are a contract with `charts/ci-cache` (same as
  # s3Endpoint/turboApi above) - renaming one side without the other
  # silently breaks the mirror for every pool. `insecure = true` is
  # required because the mirrors are plain-HTTP ClusterIP Services (no TLS
  # terminates in front of them, same reasoning as SCCACHE_S3_USE_SSL above).
  registryMirrors:
    - upstream: docker.io
      mirror: registry-cache-dockerio.ci-cache.svc.cluster.local:5000
    - upstream: ghcr.io
      mirror: registry-cache-ghcr.ci-cache.svc.cluster.local:5000

# Rendered by templates/arc-runner-pools.yaml into 4 plain Applications
# (gis-sse-runners, gis-lightbridge-ai-runners, vymalo-runners,
# adorsys-gis-runner-runners) - previously 4 hand-duplicated ~250-line
# blocks under `applications:` above, ~95% identical. Only the fields
# below actually vary per pool; everything else (image, env, affinity,
# secrets) is shared boilerplate in the template. Set `resourceProfile: high`
# on a pool to opt it into arcRunnerResourceProfiles.high (4vCPU/8Gi) instead
# of the standard-profile default (2vCPU/4Gi). The build-cache endpoints
# (Turborepo + sccache/S3) are NOT set per pool anymore - every pool is on
# netcup-k8s and shares the single in-cluster cache defined in
# `arcRunnerCache` above; only `turboTeam` still varies per pool.
arcRunnerPools:
  - name: vymalo-arc-runners
    releaseName: vymalo-arc-vps
    githubConfigUrl: https://github.com/vymalo
    runnerScaleSetName: ubuntu-amd-x64
    runnerGroup: default
    scaleSetLabels:
      - vymalo-vps
    resourceProfile: standard
    maxRunners: 10
    containersSizeLimit: 30Gi
    turboTeam: vymalo
    destinationCluster: netcup-k8s
    namespace: gh-runners-vymalo
    managedNamespacePrivileged: true
    enableRunner: true

  - name: vaam-store-runners
    releaseName: vaam-store-runner
    githubConfigUrl: https://github.com/vaam-store
    runnerScaleSetName: ubuntu-amd-x64
    runnerGroup: default
    resourceProfile: standard
    maxRunners: 10
    containersSizeLimit: 40Gi
    turboTeam: vaam-store
    destinationCluster: netcup-k8s
    namespace: gh-runners-vaam-store
    managedNamespacePrivileged: true
    enableRunner: true

  - name: vaam-store-medium-runners
    releaseName: vaam-store-runner
    githubConfigUrl: https://github.com/vaam-store
    runnerScaleSetName: ubuntu-amd-x64-medium
    runnerGroup: default
    resourceProfile: medium
    maxRunners: 6
    containersSizeLimit: 60Gi
    turboTeam: vaam-store
    destinationCluster: netcup-k8s
    namespace: gh-runners-vaam-store-medium
    managedNamespacePrivileged: true
    enableRunner: true

  - name: vaam-store-high-runners
    releaseName: vaam-store-runner
    githubConfigUrl: https://github.com/vaam-store
    runnerScaleSetName: ubuntu-amd-x64-high
    runnerGroup: default
    resourceProfile: high
    maxRunners: 4
    containersSizeLimit: 80Gi
    turboTeam: vaam-store
    destinationCluster: netcup-k8s
    namespace: gh-runners-vaam-store-high
    managedNamespacePrivileged: true
    enableRunner: true
    #priorityClass: 1000

  ## Org vaam-apps
  - name: vaam-apps-runners
    releaseName: vaam-apps-runner
    githubConfigUrl: https://github.com/vaam-apps
    runnerScaleSetName: ubuntu-amd-x64
    runnerGroup: default
    resourceProfile: standard
    maxRunners: 10
    containersSizeLimit: 40Gi
    turboTeam: vaam-apps
    destinationCluster: netcup-k8s
    namespace: gh-runners-vaam-apps
    managedNamespacePrivileged: true
    enableRunner: true

  - name: vaam-apps-medium-runners
    releaseName: vaam-apps-runner
    githubConfigUrl: https://github.com/vaam-apps
    runnerScaleSetName: ubuntu-amd-x64-medium
    runnerGroup: default
    resourceProfile: medium
    maxRunners: 6
    containersSizeLimit: 60Gi
    turboTeam: vaam-apps
    destinationCluster: netcup-k8s
    namespace: gh-runners-vaam-apps-medium
    managedNamespacePrivileged: true
    enableRunner: true

  - name: vaam-apps-high-runners
    releaseName: vaam-apps-runner
    githubConfigUrl: https://github.com/vaam-apps
    runnerScaleSetName: ubuntu-amd-x64-high
    runnerGroup: default
    resourceProfile: high
    # Observed 2026-09-11 12:23-18:00 UTC: this scale set showed 4 registered
    # runners, 3 permanently `offline` and 1 busy, while 38 queued
    # `ubuntu-amd-x64-high` jobs sat for 5+ hours - meanwhile the `-medium`
    # pool on the same netcup-k8s cluster kept getting pods scheduled. With
    # requests==limits (the `high` profile: 7 CPU / 12Gi, Guaranteed QoS),
    # no node had room for a 7/12Gi pod once smaller runner pods and other
    # workloads held the rest of the capacity, so ARC counted the
    # unschedulable pods toward maxRunners and never replaced them.
    # `resourceRequests` below drops only what the scheduler asks for, to
    # Burstable QoS (3 CPU / 6Gi requested) - the pool's `limits` stay the
    # profile's 7/12Gi, so a scheduled build still gets the full headroom the
    # `high` profile exists for, and CARGO_BUILD_JOBS (pinned from
    # `$profile.cpu`, i.e. 7) is unaffected. Trade-off: a node can now be
    # oversubscribed on cpu/memory; under real pressure the kubelet evicts
    # Burstable pods before Guaranteed ones, which is the order we want here
    # - a runner retry is cheaper than a pool stuck at 3-of-4 offline for
    # hours. Do NOT flip on `priorityClass` for this fix: it would preempt
    # other orgs' already-running CI jobs on the same cluster, not just
    # reserve room for new ones.
    # The other orgs' `high` pools (sse-gis-high-runners, vaam-store-high-
    # runners) are deliberately left at requests==limits until the owner
    # confirms actual node capacity on netcup-k8s (`kubectl --context
    # admin@netcup get nodes -o wide` + `describe nodes` Allocatable, and
    # `kubectl -n gh-runners-vaam-apps-high get pods` showing a `Pending` pod
    # with an `Insufficient cpu`/`Insufficient memory` FailedScheduling event
    # is the confirmation this was starvation, not something else).
    resourceRequests:
      cpu: "3"
      memory: 6Gi
    maxRunners: 4
    containersSizeLimit: 80Gi
    turboTeam: vaam-apps
    destinationCluster: netcup-k8s
    namespace: gh-runners-vaam-apps-high
    managedNamespacePrivileged: true
    enableRunner: true
    #priorityClass: 1000