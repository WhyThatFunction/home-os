applications:
  - name: gateway-api-crds
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: "v1.*"
      path: config/crd
    destination:
      server: https://kubernetes.default.svc
      namespace: kube-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: gateway-api-crds-netcup
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: "v1.*"
      path: config/crd
    destination:
      name: netcup-k8s
      namespace: kube-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: gateway-api-crds-remote
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: "v1.*"
      path: config/crd
    destination:
      name: home-remote
      namespace: kube-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: traefik
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://traefik.github.io/charts
      targetRevision: "40.*"
      chart: traefik
      helm:
        valuesObject:
          additionalArguments:
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--serversTransport.insecureSkipVerify=true"
            - "--log.level=ERROR"
            - "--entryPoints.web.http.redirections.entryPoint.to=:443"
            - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
            - "--entryPoints.web.http2.maxConcurrentStreams=1000"
            - "--entryPoints.websecure.http2.maxConcurrentStreams=1000"
            - "--global.sendAnonymousUsage=false"
            # Uncomment the next line if you want to use your self-signed cert for Traefik dashboard
            # - "--entrypoints.websecure.http.tls.domains[0].main=*.home.ssegning"
          logs:
            access:
              enabled: false
          deployment:
            replicas: 3
          service:
            loadBalancerIP: 10.10.0.140
          ports:
            web:
              forwardedHeaders:
                trustedIPs:
                  - 10.10.0.0/24
            websecure:
              forwardedHeaders:
                trustedIPs:
                  - 10.10.0.0/24
            traefik:
              expose:
                web: true
                websecure: true
          providers:
            kubernetesCRD:
              allowCrossNamespace: true
            kubernetesGateway:
              enabled: true
              experimentalChannel: false
              # Gateway API `BackendTLSPolicy` (v1, GA, part of the STANDARD
              # channel per this cluster's installed CRD:
              # `backendtlspolicies.gateway.networking.k8s.io` carries both
              # `v1`/`v1alpha3` and the `gateway.networking.k8s.io/channel:
              # standard` label, bundle-version v1.6.1) needs no
              # `experimentalChannel` flag — only `TCPRoute` does.
              #
              # This is the confirmed backend-TLS mechanism for
              # vaam-store/platform's mTLS S2S cutover (ADR-0016 amendment;
              # platform PR #191 / issue #190) once it flips its 8 services'
              # business ports to TLS-only: Traefik's own hop from this
              # Gateway to each pod must stop being plaintext.
              #
              # Verified by reading this cluster's actual deployed Traefik
              # (v3.7.4) provider source
              # (`pkg/provider/kubernetes/gateway/httproute.go` at the
              # `v3.7.4` tag), not just the docs:
              #   - `loadHTTPServers` looks up `BackendTLSPolicy` objects
              #     targeting the backendRef Service via
              #     `ListBackendTLSPoliciesForService`, in the SAME namespace
              #     as the HTTPRoute/Service (no cross-namespace policy
              #     attachment exists in the Gateway API spec, so no
              #     `ReferenceGrant` is needed for this).
              #   - A match forces the backend protocol to HTTPS and builds
              #     an internal `dynamic.ServersTransport` from the policy:
              #     `RootCAs` from `validation.caCertificateRefs` (both
              #     `ConfigMap` AND `Secret` kinds are supported as of
              #     v3.7 — the `Secret` case was still missing as of
              #     traefik/traefik#12970, closed Apr 2026), each requiring
              #     a `ca.crt` data key; `ServerName` from
              #     `validation.hostname`, used for real hostname
              #     verification (this resolves traefik/traefik#12127's
              #     "cannot validate certificate for <pod IP>" failure mode
              #     — that was an empty/unthreaded hostname on the older
              #     v3.5.3 the report was filed against, not a structural
              #     gap; this cluster's v3.7.4 threads it correctly).
              #   - The Traefik-specific `ServersTransport` CRD
              #     (`serverstransports.traefik.io`, also installed) is NOT
              #     an alternative here: Traefik's own docs and this same
              #     provider file confirm it's only reachable via the
              #     IngressRoute/`kubernetesCRD` provider or a Service
              #     annotation for the plain Ingress provider — never via a
              #     Gateway API HTTPRoute backendRef. `BackendTLSPolicy` is
              #     the only lever for this cluster's HTTPRoute-based vaam
              #     routing.
              #
              # RBAC is ALREADY sufficient — `traefik-kube-system`
              # ClusterRole (chart-managed, unchanged by us) already grants
              # get/list/watch on `backendtlspolicies` + `referencegrants`
              # and update on `backendtlspolicies/status`, plus
              # cluster-wide get/list/watch on `secrets`/`configmaps`
              # (verified live via `kubectl get clusterrole
              # traefik-kube-system -o yaml`).
              #
              # Net result: THIS repo needs no further change for the
              # Traefik hop. The vaam-scoped `vaam-ca` ClusterIssuer
              # (`../cert/templates/cluster-issuer.vaam-ca.yaml`, PR #130)
              # is the only cluster-side prerequisite, and it already
              # exists (home cluster only, matching where
              # vaam-store/platform deploys — `destination.server:
              # https://kubernetes.default.svc` in
              # `serverless/k/vaam-store-platform/argocd-application.yaml`).
              # Everything else is a platform-chart-side job: per service,
              # attach one `BackendTLSPolicy` (apiVersion
              # `gateway.networking.k8s.io/v1`, matching what this Traefik
              # version actually deserializes) to the Service, with
              # `validation.hostname` set to the SAME short name as the
              # cert-manager `Certificate`'s SAN (ADR-0016 amendment D9),
              # and `validation.caCertificateRefs` pointing at that SAME
              # per-service leaf-cert Secret the mTLS cutover already
              # creates (`<service>-mtls-cert`) — a `ca`-type
              # `ClusterIssuer` (which `vaam-ca` is) makes cert-manager
              # populate that Secret's `ca.crt` automatically, so no
              # separate CA-bundle propagation step exists anywhere. Traefik
              # itself needs no client certificate of its own — confirmed
              # against platform PR #191's `crates/auth-kit/src/mtls.rs`
              # (`WebPkiClientVerifier::builder(...).allow_unauthenticated()`,
              # proven by
              # `no_client_certificate_still_completes_the_handshake_and_falls_through`)
              # — the client-cert-optional design exists specifically so
              # Traefik-forwarded and kubelet-probe traffic (neither
              # presents one) still complete the handshake; Traefik is a
              # plain, anonymous TLS client here, verifying the pod's
              # server cert only.
            #knative:
            #  enabled: true

          #experimental:
          #  knative: true

          gateway:
            namespacePolicy: All
            listeners:
              web:
                namespacePolicy:
                  from: All
              websecure:
                port: 8443
                protocol: HTTPS
                namespacePolicy:
                  from: All
                certificateRefs:
                  - name: 'wildcard-sls-ssegning-com-tls'
                    kind: Secret
                    group: ''
                mode: Terminate
          
          ingressRoute:
            dashboard:
              enabled: true
              entryPoints:
                #- web
                - websecure
              matchRule: Host(`traefik.home.ssegning`)
              tls:
                secretName: traefik.home.ssegning-tls
          
          extraObjects:
            - |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: traefik-certificate
              spec:
                secretName: traefik.home.ssegning-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: self-signed-ca
                  group: cert-manager.io
                commonName: traefik.home.ssegning
                dnsNames: 
                  - traefik.home.ssegning
            - |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: wildcard-sls-ssegning-com-certificate
              spec:
                secretName: wildcard-sls-ssegning-com-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: cert-cloudflare
                  group: cert-manager.io
                #commonName: sls.ssegning.com
                dnsNames: 
                  - "*.ssegning.com"
                  #- sls.ssegning.com
    destination:
      server: https://kubernetes.default.svc
      namespace: kube-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

  - name: traefik-netcup
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://traefik.github.io/charts
      targetRevision: "*"
      chart: traefik
      helm:
        releaseName: traefik
        valuesObject:
          additionalArguments:
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--serversTransport.insecureSkipVerify=true"
            - "--entryPoints.web.http.redirections.entryPoint.to=:443"
            - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
            - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
            - "--entryPoints.web.http2.maxConcurrentStreams=1000"
            - "--entryPoints.websecure.http2.maxConcurrentStreams=1000"
            - "--global.sendAnonymousUsage=false"
            # Uncomment the next line if you want to use your self-signed cert for Traefik dashboard
            # - "--entrypoints.websecure.http.tls.domains[0].main=*.netcup.ssegning"
          deployment:
            kind: DaemonSet
          # The chart default (maxSurge 1 / maxUnavailable 0) can never roll a
          # DaemonSet that binds hostPort 80/443: the surge pod cannot bind the
          # port a running pod already holds, so it stays Pending forever.
          updateStrategy:
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
          service:
            spec:
              type: ClusterIP
          ports:
            web:
              hostPort: 80
            websecure:
              hostPort: 443
            traefik:
              expose:
                web: true
                websecure: true
          nodeSelector:
            node-role.kubernetes.io/worker: worker
          providers:
            kubernetesCRD:
              allowCrossNamespace: true
            # Off on netcup: the chart publishes the Gateway status address from
            # its own Service, which is ClusterIP here (no LB on netcup, we use
            # hostPort), so it never gets a loadBalancer ingress. The Gateway
            # status never converges and every replica rewrites it in a hot loop
            # (~120 status PUTs/sec), which starved etcd and crashlooped the
            # control plane. No Gateway API routes exist on this cluster.
            kubernetesGateway:
              enabled: false

          ingressRoute:
            dashboard:
              enabled: true
              entryPoints:
                - web
                - websecure
              matchRule: Host(`traefik.netcup.ssegning`)
              tls:
                secretName: wildcard-netcup-tls

          extraObjects:
            - |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: traefik-certificate
              spec:
                secretName: wildcard-netcup-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: self-signed-ca
                  group: cert-manager.io
                commonName: traefik.netcup.ssegning
                dnsNames: 
                  - "*.netcup.ssegning"
                  - traefik.netcup.ssegning
                  - "*.serverless.netcup.ssegning"
                  - "serverless.netcup.ssegning"
            - |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: sls-certificate
              spec:
                secretName: wildcard-sls-server-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: cert-cloudflare
                  group: cert-manager.io
                commonName: servers.segning.pro
                dnsNames: 
                  - servers.segning.pro
                  - "*.sls.servers.segning.pro"

    destination:
      name: netcup-k8s
      namespace: traefik-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      managedNamespaceMetadata:
        labels:
          pod-security.kubernetes.io/enforce: privileged
      automated:
        prune: true
        selfHeal: true

  - name: traefik-remote
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://traefik.github.io/charts
      targetRevision: "*"
      chart: traefik
      helm:
        releaseName: traefik
        valuesObject:
          additionalArguments:
            - "--entryPoints.web.http.redirections.entryPoint.to=:443"
            - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
            - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
            #- "--entryPoints.web.http2.maxConcurrentStreams=1000"
            #- "--entryPoints.websecure.http2.maxConcurrentStreams=1000"
            - "--global.sendAnonymousUsage=false"
          deployment:
            kind: DaemonSet

          service:
            enabled: true
            type: LoadBalancer
            annotations:
              load-balancer.hetzner.cloud/name: "traefik-ingress"
              load-balancer.hetzner.cloud/location: "nbg1"
              load-balancer.hetzner.cloud/use-private-ip: "true"
              load-balancer.hetzner.cloud/health-check-interval: "10s"
              load-balancer.hetzner.cloud/health-check-timeout: "5s"
              load-balancer.hetzner.cloud/health-check-retries: "3"

          ports:
            web:
              http:
                redirections:
                  entryPoint:
                    to: websecure
                    scheme: https
                    permanent: true
            websecure:
              http:
                tls:
                  enabled: true

          ingressRoute:
            dashboard:
              enabled: false

          providers:
            kubernetesCRD:
              enabled: true
              allowCrossNamespace: true
              allowExternalNameServices: true
            kubernetesIngress:
              enabled: true
              allowExternalNameServices: true
            kubernetesGateway:
              enabled: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          podSecurityContext:
            runAsNonRoot: true
            runAsGroup: 65532
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          metrics:
            prometheus:
              enabled: true
              serviceMonitor:
                enabled: false
                namespace: observability

          gateway:
            namespacePolicy: All
            listeners:
              web:
                namespacePolicy:
                  from: All
              websecure:
                port: 8443
                protocol: HTTPS
                namespacePolicy:
                  from: All
                certificateRefs:
                  - name: 'wildcard-ai-server-tls'
                    kind: Secret
                    group: ''
                mode: Terminate

          extraObjects:
            - |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: ai-certificate
              spec:
                secretName: wildcard-ai-server-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: cert-cloudflare
                  group: cert-manager.io
                commonName: ai.camer.digital
                dnsNames: 
                  - ai.camer.digital
                  - "*.ai.camer.digital"
                  - "*.coder-ai.ai.camer.digital"
                  - "*.mlops.ai.camer.digital"
                  - "*.serverless.mlops.ai.camer.digital"

    destination:
      name: home-remote
      namespace: traefik
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      managedNamespaceMetadata:
        labels:
          pod-security.kubernetes.io/enforce: privileged
      automated:
        prune: true
        selfHeal: true

