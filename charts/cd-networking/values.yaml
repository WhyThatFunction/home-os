applications:
  - name: gateway-api-crds
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: "v1.*"
      path: config/crd
    destination:
      server: https://kubernetes.default.svc
      namespace: kube-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: gateway-api-crds-netcup
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: "v1.*"
      path: config/crd
    destination:
      name: netcup-k8s
      namespace: kube-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: gateway-api-crds-remote
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://github.com/kubernetes-sigs/gateway-api.git
      targetRevision: "v1.*"
      path: config/crd
    destination:
      name: home-remote
      namespace: kube-system
    syncPolicy:
      syncOptions:
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: traefik
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://traefik.github.io/charts
      targetRevision: "40.*"
      chart: traefik
      helm:
        valuesObject:
          additionalArguments:
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--serversTransport.insecureSkipVerify=true"
            - "--log.level=ERROR"
            - "--entryPoints.web.http.redirections.entryPoint.to=:443"
            - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
            - "--entryPoints.web.http2.maxConcurrentStreams=1000"
            - "--entryPoints.websecure.http2.maxConcurrentStreams=1000"
            - "--global.sendAnonymousUsage=false"
            # Uncomment the next line if you want to use your self-signed cert for Traefik dashboard
            # - "--entrypoints.websecure.http.tls.domains[0].main=*.home.ssegning"
          logs:
            access:
              enabled: false
          deployment:
            replicas: 3
          service:
            loadBalancerIP: 10.10.0.140
          ports:
            web:
              forwardedHeaders:
                trustedIPs:
                  - 10.10.0.0/24
            websecure:
              forwardedHeaders:
                trustedIPs:
                  - 10.10.0.0/24
            traefik:
              expose:
                web: true
                websecure: true
          providers:
            kubernetesCRD:
              allowCrossNamespace: true
            kubernetesGateway:
              enabled: true
              experimentalChannel: false
              # Gateway API `BackendTLSPolicy` (v1, GA, part of the STANDARD
              # channel per this cluster's installed CRD) needs no
              # `experimentalChannel` flag — only `TCPRoute` does. The
              # `traefik-kube-system` ClusterRole (chart-managed, unchanged
              # by us) already grants the RBAC a `BackendTLSPolicy` consumer
              # needs, so no further change is required here for that.
            #knative:
            #  enabled: true

          #experimental:
          #  knative: true

          gateway:
            namespacePolicy: All
            listeners:
              web:
                namespacePolicy:
                  from: All
              websecure:
                port: 8443
                protocol: HTTPS
                namespacePolicy:
                  from: All
                certificateRefs:
                  - name: 'wildcard-sls-ssegning-com-tls'
                    kind: Secret
                    group: ''
                mode: Terminate
          
          ingressRoute:
            dashboard:
              enabled: true
              entryPoints:
                #- web
                - websecure
              matchRule: Host(`traefik.home.ssegning`)
              tls:
                secretName: traefik.home.ssegning-tls
          
          extraObjects:
            - |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: traefik-certificate
              spec:
                secretName: traefik.home.ssegning-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: self-signed-ca
                  group: cert-manager.io
                commonName: traefik.home.ssegning
                dnsNames: 
                  - traefik.home.ssegning
            - |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: wildcard-sls-ssegning-com-certificate
              spec:
                secretName: wildcard-sls-ssegning-com-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: cert-cloudflare
                  group: cert-manager.io
                #commonName: sls.ssegning.com
                dnsNames: 
                  - "*.ssegning.com"
                  #- sls.ssegning.com
    destination:
      server: https://kubernetes.default.svc
      namespace: kube-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

  - name: traefik-netcup
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://traefik.github.io/charts
      # Pinned to the 41.x line. Unpinned "*" floats to whatever is newest, which
      # is how the live pods sat on 41.0.2 while ArgoCD reported 41.3.0 synced.
      targetRevision: "41.*"
      chart: traefik
      helm:
        releaseName: traefik
        valuesObject:
          additionalArguments:
            - "--api.dashboard=true"
            - "--api.insecure=true"
            - "--serversTransport.insecureSkipVerify=true"
            - "--entryPoints.web.http.redirections.entryPoint.to=:443"
            - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
            - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
            - "--entryPoints.web.http2.maxConcurrentStreams=1000"
            - "--entryPoints.websecure.http2.maxConcurrentStreams=1000"
            - "--global.sendAnonymousUsage=false"
            # Uncomment the next line if you want to use your self-signed cert for Traefik dashboard
            # - "--entrypoints.websecure.http.tls.domains[0].main=*.netcup.ssegning"
          deployment:
            kind: DaemonSet
          # The chart default (maxSurge 1 / maxUnavailable 0) can never roll a
          # DaemonSet that binds hostPort 80/443: the surge pod cannot bind the
          # port a running pod already holds, so it stays Pending forever.
          updateStrategy:
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
          service:
            spec:
              type: ClusterIP
          ports:
            web:
              hostPort: 80
            websecure:
              hostPort: 443
            traefik:
              expose:
                web: true
                websecure: true
          nodeSelector:
            node-role.kubernetes.io/worker: worker
          # Mirrors traefik-remote, which has run these for months.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          providers:
            kubernetesCRD:
              allowCrossNamespace: true
            # Off on netcup: the chart publishes the Gateway status address from
            # its own Service, which is ClusterIP here (no LB on netcup, we use
            # hostPort), so it never gets a loadBalancer ingress. The Gateway
            # status never converges and every replica rewrites it in a hot loop
            # (~120 status PUTs/sec), which starved etcd and crashlooped the
            # control plane. No Gateway API routes exist on this cluster.
            kubernetesGateway:
              enabled: false

          ingressRoute:
            dashboard:
              enabled: true
              entryPoints:
                - web
                - websecure
              matchRule: Host(`traefik.netcup.ssegning`)
              tls:
                secretName: wildcard-netcup-tls

          extraObjects:
            - |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: traefik-certificate
              spec:
                secretName: wildcard-netcup-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: self-signed-ca
                  group: cert-manager.io
                commonName: traefik.netcup.ssegning
                dnsNames: 
                  - "*.netcup.ssegning"
                  - traefik.netcup.ssegning

    destination:
      name: netcup-k8s
      namespace: traefik-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      managedNamespaceMetadata:
        labels:
          pod-security.kubernetes.io/enforce: privileged
      automated:
        prune: true
        selfHeal: true

  - name: traefik-remote
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://traefik.github.io/charts
      # See the note on traefik-netcup above.
      targetRevision: "41.*"
      chart: traefik
      helm:
        releaseName: traefik
        valuesObject:
          additionalArguments:
            - "--entryPoints.web.http.redirections.entryPoint.to=:443"
            - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
            - "--entryPoints.web.http.redirections.entryPoint.permanent=true"
            #- "--entryPoints.web.http2.maxConcurrentStreams=1000"
            #- "--entryPoints.websecure.http2.maxConcurrentStreams=1000"
            - "--global.sendAnonymousUsage=false"
          deployment:
            kind: DaemonSet

          service:
            enabled: true
            type: LoadBalancer
            annotations:
              load-balancer.hetzner.cloud/name: "traefik-ingress"
              load-balancer.hetzner.cloud/location: "nbg1"
              load-balancer.hetzner.cloud/use-private-ip: "true"
              # A Hetzner Cloud LB is a real proxy: it terminates the client TCP
              # connection and opens a new one to the node, so the backend always
              # sees the LB's own (private) IP as the source. `externalTrafficPolicy:
              # Local` cannot recover the client IP here — it only removes kube-proxy's
              # *second* SNAT hop. The only way to carry the client IP across a TCP-mode
              # hcloud LB is the PROXY protocol, which must be enabled on BOTH sides:
              # here on the LB, and below via `ports.*.proxyProtocol.trustedIPs`.
              load-balancer.hetzner.cloud/uses-proxyprotocol: "true"
              load-balancer.hetzner.cloud/health-check-interval: "10s"
              load-balancer.hetzner.cloud/health-check-timeout: "5s"
              load-balancer.hetzner.cloud/health-check-retries: "3"
            spec:
              # Drops kube-proxy's SNAT so the PROXY header's peer address stays the
              # LB's private IP (the address the trustedIPs below are matched against)
              # instead of a random node IP. Safe with `deployment.kind: DaemonSet`:
              # every node runs a Traefik pod, so no node is a black hole.
              externalTrafficPolicy: Local

          ports:
            web:
              http:
                redirections:
                  entryPoint:
                    to: websecure
                    scheme: https
                    permanent: true
              # Traefik only honours a PROXY header from a peer in this list; from
              # anyone else the connection is rejected. Must cover the hcloud LB's
              # private IP — i.e. the subnet of the Hetzner private network this
              # cluster is attached to (`hcloud network describe <net>`).
              proxyProtocol:
                trustedIPs:
                  - 10.0.0.0/16
              # With PROXY protocol in front, X-Forwarded-* arriving on the wire is
              # only trustworthy from the same LB.
              forwardedHeaders:
                trustedIPs:
                  - 10.0.0.0/16
            websecure:
              http:
                tls:
                  enabled: true
              proxyProtocol:
                trustedIPs:
                  - 10.0.0.0/16
              forwardedHeaders:
                trustedIPs:
                  - 10.0.0.0/16

          ingressRoute:
            dashboard:
              enabled: false

          providers:
            kubernetesCRD:
              enabled: true
              allowCrossNamespace: true
              allowExternalNameServices: true
            kubernetesIngress:
              enabled: true
              allowExternalNameServices: true
            kubernetesGateway:
              enabled: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          podSecurityContext:
            runAsNonRoot: true
            runAsGroup: 65532
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true

          metrics:
            prometheus:
              enabled: true
              serviceMonitor:
                enabled: false
                namespace: observability

          gateway:
            namespacePolicy: All
            listeners:
              web:
                namespacePolicy:
                  from: All
              websecure:
                port: 8443
                protocol: HTTPS
                namespacePolicy:
                  from: All
                # Must match what knative actually serves through this Gateway.
                # knative-serving on home-remote binds traefik/traefik-gateway
                # (charts/cd-serverless/values.yaml, config-gateway
                # external-gateways) with domain `serverless.mlops.camer.digital`
                # and domain-template `{Name}-{Namespace}--{Domain}`, so a
                # KService renders as
                #   <name>-<ns>--serverless.mlops.camer.digital
                # whose parent is `mlops.camer.digital` -> `*.mlops.camer.digital`.
                certificateRefs:
                  - name: 'wildcard-mlops-camer-digital-tls'
                    kind: Secret
                    group: ''
                mode: Terminate

          extraObjects:
            # Replaces the former `ai-certificate`. That one covered
            # `*.ai.camer.digital` and friends — names this Gateway never
            # serves. The only consumer of traefik/traefik-gateway is
            # knative-serving, whose hostnames sit under `mlops.camer.digital`
            # (NOT `mlops.ai.camer.digital`), so the old certificate could never
            # have matched a single request that arrived here.
            #
            # `cert-cloudflare`, not `cert-route53`: `mlops.camer.digital` has
            # no NS delegation — Cloudflare is authoritative for it, unlike
            # `ai.camer.digital`. Verified with `dig +short NS mlops.camer.digital`
            # (empty) and the SOA at `camer.digital` -> lennox.ns.cloudflare.com.
            # This is a wildcard, so it needs DNS-01 regardless.
            - |
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: serverless-gateway-certificate
              spec:
                secretName: wildcard-mlops-camer-digital-tls
                issuerRef:
                  kind: ClusterIssuer
                  name: cert-cloudflare
                  group: cert-manager.io
                # ONE wildcard SAN, no `commonName`, and deliberately NOT the
                # bare `serverless.mlops.camer.digital` alongside it. Let's
                # Encrypt rejects the order outright if a name is also covered
                # by a wildcard in the same request:
                #
                #   400 urn:ietf:params:acme:error:malformed: Domain name
                #   "serverless.mlops.camer.digital" is redundant with a
                #   wildcard domain in the same request.
                #
                # `*.mlops.camer.digital` already covers that name — it is a
                # single label under `mlops.camer.digital` — so nothing is lost.
                # Same shape as `wildcard-sls-ssegning-com-certificate` above
                # (whose `commonName` and bare name are commented out for this
                # reason) and as the working `coder/coder-wildcard-tls`.
                dnsNames:
                  - "*.mlops.camer.digital"

    destination:
      name: home-remote
      namespace: traefik
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      managedNamespaceMetadata:
        labels:
          pod-security.kubernetes.io/enforce: privileged
      automated:
        prune: true
        selfHeal: true

