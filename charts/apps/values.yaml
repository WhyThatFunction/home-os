  # OpenHands Agent Canvas on netcup-k8s, behind Keycloak via oauth2-proxy.
  # https://docs.openhands.dev/openhands/usage/agent-canvas/backend-setup/kubernetes
  #
  # The chart is not published to any Helm/OCI registry, so it is consumed
  # from the OpenHands repo at the release tag; bump `targetRevision` to
  # upgrade (the image tag follows the chart's appVersion).
  #
  # It is ONE all-in-one pod: frontend + agent-server + automation behind a
  # single port 8000 (/canvas UI, /api, /sockets websocket, /vscode editor).
  # Agent Canvas has no user auth of its own, and its static server bakes the
  # backend session API key into the served HTML — anyone who can load the
  # page holds a key that runs shell in the pod. So the oauth2-proxy is not a
  # "frontend only" guard: it is the only ingress, reverse-proxying EVERY path
  # to the agent-canvas Service after Keycloak login. Never re-enable the
  # chart's own `ingress` — that would publish the key unauthenticated.
  #
  #   agent-canvas.sls.servers.segning.pro  -> oauth2-proxy -> agent-canvas:8000
  #
  # TLS: `cert-cloudflare` (DNS-01, segning.pro is a Cloudflare zone).
  # oauth2-proxy credentials: AWS SM `prod/meta/test-app`, properties
  # agent_canvas_oauth2_client_id / agent_canvas_oauth2_secret /
  # agent_canvas_cookie_secret, from a confidential `agent-canvas` client in
  # Keycloak realm `ssegning-internal` (redirect URI
  # https://agent-canvas.sls.servers.segning.pro/oauth2/callback).
  #
  # State (settings, LLM keys encrypted with the auto-generated OH_SECRET_KEY,
  # conversations, workspace, SQLite automation DB) lives on the single RWO
  # PVC `data-agent-canvas-0`, so this stays a single replica.
  - name: agent-canvas
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: agent-canvas
    sources:
      - repoURL: https://github.com/OpenHands/OpenHands.git
        targetRevision: v1.24.0
        path: helm/agent-canvas
        helm:
          releaseName: agent-canvas
          valuesObject:
            # Upstream agent-canvas plus Rust/Flutter/Node toolchains under
            # /opt, built by github.com/vymalo/openhand-images. Pin the
            # immutable `<agent-canvas version>-<sha7>` tag, and keep the
            # version in step with `targetRevision` above.
            image:
              repository: ghcr.io/vymalo/openhand-images/agent-canvas
              tag: 1.24.0-f2d1ca9
            # RBAC stays off (chart default): the agent gets no Kubernetes
            # API rights, so it does not need the SA token either.
            serviceAccount:
              automountServiceAccountToken: false
            # Merges over the chart's podSecurityContext (fsGroup 10001 etc.).
            # Default policy re-chowns the whole volume recursively on every
            # pod start; with worktrees and cargo target/ dirs on it that is
            # millions of files. Only fix ownership when the root is wrong.
            podSecurityContext:
              fsGroupChangePolicy: OnRootMismatch
            persistence:
              storageClassName: longhorn
              # Only these paths survive a restart; everything else (/tmp,
              # the rest of $HOME) is container filesystem. Lists replace
              # wholesale, so the chart's two default mounts are restated.
              # Toolchains are baked into the image under /opt (see `image`
              # above), so nothing here may be mounted over /opt. ~/.cargo
              # (CARGO_HOME: crate registry/git caches, `cargo install`ed
              # tools) and ~/.cache (pub, pnpm, npm, uv caches — see the env
              # below) keep downloads across restarts. Neither exists in the
              # image, so these mounts hide nothing.
              mounts:
                - mountPath: /home/openhands/.openhands
                  subPath: openhands
                - mountPath: /home/openhands/workspace
                  subPath: workspace
                - mountPath: /home/openhands/.cargo
                  subPath: cargo
                - mountPath: /home/openhands/.cache
                  subPath: cache
                # ACP agents Agent Canvas can drive. A subscription/OAuth
                # login takes priority over an API key and lives on disk:
                # Claude Code in ~/.claude (.credentials.json on Linux, plus
                # ~/.claude.json — relocated inside by CLAUDE_CONFIG_DIR
                # below), Codex in ~/.codex (auth.json, config.toml).
                - mountPath: /home/openhands/.claude
                  subPath: claude
                - mountPath: /home/openhands/.codex
                  subPath: codex
            # The agent compiles inside this same pod (no sandbox pods), next
            # to the server processes. At the chart default (2 CPU / 4Gi) a
            # single `cargo build` of vaam-backend pinned memory at the 4Gi
            # limit (rustc alone ~2.2GB RSS) and throttled the CPU until
            # /alive stopped answering within 5s, the UI dropped and liveness
            # was on course to restart the container mid-build. Burstable:
            # modest requests so it still schedules, room to build above them.
            resources:
              requests:
                cpu: "2"
                memory: 4Gi
              limits:
                cpu: "8"
                memory: 16Gi
            # A busy build can still slow /alive; don't let liveness kill the
            # agent for being slow. ~5 min of consecutive failures to restart.
            probes:
              liveness:
                timeoutSeconds: 15
                failureThreshold: 10
              readiness:
                timeoutSeconds: 15
            config:
              extraEnv:
                # Opt out of the bundled PostHog product analytics.
                - name: DO_NOT_TRACK
                  value: "1"
                - name: VITE_DO_NOT_TRACK
                  value: "1"
                # agent-server puts per-conversation git worktrees under
                # conversation_worktree_root, default /tmp/conversation-worktrees
                # (openhands-agent-server config.py; OH_ + field name). /tmp is
                # not on the PVC, so a pod restart deleted a worktree with all
                # its uncommitted work. Keep them on the persistent workspace
                # mount instead.
                - name: OH_CONVERSATION_WORKTREE_ROOT
                  value: /home/openhands/workspace/.conversation-worktrees
                # Package caches that default outside ~/.cache, moved onto the
                # persistent ~/.cache mount.
                - name: PUB_CACHE
                  value: /home/openhands/.cache/pub
                - name: npm_config_store_dir
                  value: /home/openhands/.cache/pnpm-store
                - name: npm_config_cache
                  value: /home/openhands/.cache/npm
                # Without it Claude Code writes ~/.claude.json (sign-in session,
                # MCP servers, per-project trust) at the root of $HOME, which is
                # not persisted. Set, that file lives inside this directory
                # (verified: nothing is written to $HOME).
                - name: CLAUDE_CONFIG_DIR
                  value: /home/openhands/.claude

      - repoURL: https://bjw-s-labs.github.io/helm-charts
        targetRevision: "4.*"
        chart: app-template
        helm:
          releaseName: agent-canvas-auth
          valuesObject:
            controllers:
              oauth2-proxy:
                containers:
                  app:
                    image:
                      repository: quay.io/oauth2-proxy/oauth2-proxy
                      tag: v7.15.4
                    args:
                      - --http-address=0.0.0.0:4180
                      - --provider=keycloak-oidc
                      - --oidc-issuer-url=https://auth.verif.fyi/realms/ssegning-internal
                      - --redirect-url=https://agent-canvas.sls.servers.segning.pro/oauth2/callback
                      - --upstream=http://agent-canvas.agent-canvas.svc.cluster.local:8000/
                      # Agent API calls can run long; websockets (/sockets)
                      # are proxied natively (--proxy-websockets defaults on).
                      - --upstream-timeout=300s
                      - --reverse-proxy=true
                      - --email-domain=*
                      - --code-challenge-method=S256
                      - --skip-provider-button=true
                      - --cookie-secure=true
                      - --cookie-samesite=lax
                    env:
                      OAUTH2_PROXY_CLIENT_ID:
                        valueFrom:
                          secretKeyRef:
                            name: agent-canvas-oauth2-creds
                            key: client-id
                      OAUTH2_PROXY_CLIENT_SECRET:
                        valueFrom:
                          secretKeyRef:
                            name: agent-canvas-oauth2-creds
                            key: client-secret
                      OAUTH2_PROXY_COOKIE_SECRET:
                        valueFrom:
                          secretKeyRef:
                            name: agent-canvas-oauth2-creds
                            key: cookie-secret
                    probes:
                      liveness:
                        enabled: true
                        custom: true
                        spec:
                          httpGet:
                            path: /ping
                            port: 4180
                          periodSeconds: 10
                      readiness:
                        enabled: true
                        custom: true
                        spec:
                          httpGet:
                            path: /ready
                            port: 4180
                          periodSeconds: 5
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true
                      runAsNonRoot: true
                      capabilities:
                        drop: ["ALL"]
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        memory: 128Mi
            service:
              oauth2-proxy:
                controller: oauth2-proxy
                ports:
                  http:
                    port: 4180
            ingress:
              main:
                className: traefik
                annotations:
                  cert-manager.io/cluster-issuer: cert-cloudflare
                hosts:
                  - host: agent-canvas.sls.servers.segning.pro
                    paths:
                      - path: /
                        pathType: Prefix
                        service:
                          identifier: oauth2-proxy
                          port: http
                tls:
                  - secretName: agent-canvas-tls
                    hosts:
                      - agent-canvas.sls.servers.segning.pro
            rawResources:
              oauth2-creds:
                forceRename: agent-canvas-oauth2-creds
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                spec:
                  spec:
                    refreshInterval: 1h0m0s
                    secretStoreRef:
                      name: ssegning-aws
                      kind: ClusterSecretStore
                    target:
                      name: agent-canvas-oauth2-creds
                      creationPolicy: Owner
                    data:
                      - secretKey: client-id
                        remoteRef:
                          key: "prod/meta/test-app"
                          property: agent_canvas_oauth2_client_id
                      - secretKey: client-secret
                        remoteRef:
                          key: "prod/meta/test-app"
                          property: agent_canvas_oauth2_secret
                      - secretKey: cookie-secret
                        remoteRef:
                          key: "prod/meta/test-app"
                          property: agent_canvas_cookie_secret
    destination:
      name: netcup-k8s
      namespace: agent-canvas
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

