argoCdConfigs:
  secretMap:
    vaam-eat-aio-repo:
      type: repository
      data:
        url: "https://github.com/vaam-store/vaam-eat-aio"
        name: vaam-eat-aio
        type: git
    apple-health-export:
      type: repository
      data:
        url: "https://whythatfunction.github.io/apple-health-export"
        name: apple-health-export
        type: helm

applications:
  # ssegning.com — the one-person-enterprise website (Strapi 5 CMS + Next.js 16).
  #
  # The chart and its values live in the APP repo
  # (github.com/WhyThatFunction/ssegning-com, path `deploy/chart`), not here.
  # That is deliberate and is the only shape that makes image promotion work:
  # `main` in home-os is PR-only behind the governance check, so nothing — not
  # CI, not argocd-image-updater — can write a new image digest back into this
  # repo. The app repo's own CI can push straight to its `main`, so its
  # `deploy/chart/values.yaml` carries `web.image.tag` / `cms.image.tag` and CI
  # bumps them to `sha-<short>` on every green build. ArgoCD tracks HEAD there
  # and rolls the new image out. Same external-repo shape as the `serverless/k`
  # deployers, minus the OCI-chart indirection.
  #
  # The repo is PUBLIC, so ArgoCD needs no repository credential and the GHCR
  # packages inherit public visibility — no imagePullSecret either.
  #
  # Hostnames (all already resolving: `ssegning.com` and `*.ssegning.com` are
  # Cloudflare-proxied CNAMEs to `ssegning.no-ip.org`, i.e. THIS cluster's
  # Traefik):
  #   ssegning.com / www.ssegning.com  -> web    (www 301s to the apex)
  #   cms.ssegning.com                 -> Strapi admin + REST
  #   god.ssegning.com                 -> 301 https://ssegning.com
  #   apps.ssegning.com                -> 301 https://ssegning.com
  #
  # Secrets come from AWS Secrets Manager `ssegning/prod/env` via the
  # `ssegning-aws` ClusterSecretStore; the Strapi upload bucket is
  # `ssegning-uploads` on the in-cluster RustFS service (see charts/s3/values.yaml).
  - name: ssegning-com
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/WhyThatFunction/ssegning-com
      targetRevision: HEAD
      # `deploy/chart`, not `deploy/cd`. That second path has NEVER existed in
      # that repository (`git log --all -- deploy/cd` is empty), so this
      # Application has never been able to render and reported
      #   ComparisonError: deploy/cd: app path does not exist
      # The failure is quiet in the worst way: an Application that cannot
      # render its source shows `Sync: Unknown` / `Health: Unknown`, because
      # there is no desired state to diff and no resources of its own to mark
      # unhealthy. It reads as fine on the dashboard while managing nothing -
      # the same shape as the turbo-cache Application fixed in #159.
      #
      # Consequence: the live ssegning stack has been running unmanaged. Its
      # images were last updated 2026-09-04 (sha-8afefda), so every chart
      # change merged since then was silently ignored, and nothing corrected
      # drift or applied `instances: 2` to the CNPG cluster.
      path: deploy/chart
    destination:
      server: https://kubernetes.default.svc
      namespace: ssegning
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  # vaam — the Vaam Store production stack (backend, admin, landing, image
  # resizer, Meilisearch, CNPG Postgres+PostGIS), replacing the deleted
  # old-platform deployer fleet this app-of-apps used to fan out to.
  #
  # The chart lives in the APP repo (github.com/vaam-apps/vaam-apps, path
  # `deploy/chart`), same shape and for the same reason as `ssegning-com`
  # above: home-os `main` is PR-only behind the governance check, so nothing
  # here can write a new image tag back into this repo. vaam-apps CI pushes
  # straight to its own `main` and bumps `deploy/chart/values.yaml` image
  # tags to `sha-<full sha>` on every green build; ArgoCD tracks HEAD there
  # and rolls the new image out.
  #
  # Unlike ssegning-com, vaam-apps is PRIVATE (repo and GHCR packages), so
  # two credentials exist for it: the ArgoCD repository credential below
  # (`vaam-apps-argocd-creds`, applied to the argocd namespace) so ArgoCD can
  # even clone the source, and the chart's own `ghcr-pull` ExternalSecret
  # (inside `deploy/chart`, ns `vaam`) so every image pull — including the
  # migrate Job — authenticates against GHCR.
  #
  # Hostnames (Traefik Gateway API, `traefik-gateway` / `kube-system`, same
  # pattern as the old platform's routes):
  #   vaam.store                     -> landing
  #   admin.vaam.store               -> admin
  #   api.vaam.store                 -> backend server (/rpc, /oauth, /healthz, /readyz)
  #   api.vaam.store/webhooks        -> backend notification
  #   api.vaam.store/api/images      -> emgr (image resizer)
    # - name: vaam
    #   finalizers:
    #     - resources-finalizer.argocd.argoproj.io
    #   project: vaam-store
    #   source:
    #     repoURL: https://github.com/vaam-apps/vaam-apps
    #     targetRevision: HEAD
    #     path: deploy/cd
    #   destination:
    #     server: https://kubernetes.default.svc
    #     namespace: vaam
    #   syncPolicy:
    #     syncOptions:
    #       - CreateNamespace=true
    #       - ServerSideApply=true
    #     automated:
    #       prune: true
    #       selfHeal: true

  # another-agentic — the orchestration layer (chat web + orchestrator behind
  # oauth2-proxy and Caddy, CNPG databases, the `chat` agent), its coder
  # agent and the operator that runs agents as custom resources, on
  # netcup-k8s, namespace `another-agentic-system`. Three Applications in the
  # AppProject `another-agentic` (charts/cd/values.yaml):
  #
  #   another-agentic-coder     vymalo/another-adam-rs  deploy/coder, release `coder`
  #   another-agentic-system    vymalo/another-agentic-system  deploy/chart
  #   another-agentic-operator  vymalo/another-adam-rs  deploy/operator, release `adam-operator`
  #
  # (The operator's CRDs are a fourth Application, `adam-operator-crds`, in the
  # `infrastructure` project of charts/cd/values.yaml.)
  #
  # No sync-wave: a later wave in this app-of-apps would wait for every other
  # app here to be healthy. The orchestrator starts without the coder and
  # reaches it by its card URL once it is up.
  #
  # The charts live in their APP repos and Argo tracks HEAD, for the reason
  # given at `ssegning-com`: home-os `main` is PR-only, so image tags are bumped
  # by each app repo's own CI in its `deploy/*/values.yaml`. All the repos are
  # PUBLIC, as are their GHCR packages: no repository credential, no
  # imagePullSecret. This file holds only what is specific to THIS deployment.
  # Decisions: another-agentic-system ADR 0041
  # (docs/decisions/0041-deployed-with-helm-on-kubernetes-secrets-by-externalsecret.md).
  #
  # Secrets: nothing secret is in git. Every value is a property of the AWS
  # Secrets Manager secret `prod/another-agentic/env`, read through the
  # ClusterSecretStore `ssegning-aws` by External Secrets (the ARC runner pools'
  # mechanism). The coder's A2A bearer is `coder_a2a_token`, the property the
  # orchestrator's chart reads for the same agent, so the two sides cannot
  # differ. The GitHub App's PEM is `github_app_private_key`: adam-rs's chart
  # only mounts a Secret you provide (`github.app.privateKeySecret`) and has no
  # ExternalSecret for it, so the Secret `coder-github-app` is rendered by the
  # second source of the coder Application (bjw-s app-template rawResources, as
  # in charts/cd/templates/arc-runner-pools.yaml).
  #
  # Before this merges (it deploys immediately), the owner actions of
  # vymalo/another-agentic-system#148 must be done: the AWS secret with every
  # property this file names, the Keycloak client, the GitHub App and its installation,
  # DNS for the host, public 443 on netcup, and a certificate issuer that can
  # sign for the host.
  #
  # Pod Security: enforce `baseline`, warn and audit at `restricted`. Every pod
  # the charts render sets runAsNonRoot, drops ALL capabilities (the edge adds
  # NET_BIND_SERVICE) and uses the RuntimeDefault seccomp profile, but that is
  # unverified on this cluster, including the pods CloudNativePG creates. Raise
  # `enforce` to `restricted` once a sync shows no warning. All three
  # Applications carry the same metadata, so any may create the namespace first.
  - name: another-agentic-coder
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: another-agentic
    sources:
      - repoURL: https://github.com/vymalo/another-adam-rs
        targetRevision: HEAD
        path: deploy/coder
        helm:
          # The Service is `coder` (the chart's fullname collapses when the
          # release name contains the chart name), which the orchestrator
          # chart's default agents entry names:
          # http://coder.another-agentic-system.svc:8080
          releaseName: coder
          valuesObject:
            config:
              # The AI gateway's URL is kept in
              # AWS, property `model_base_url`, not in git (owner's choice,
              # 2026-10-04; another-adam-rs #85).
              modelBaseUrlFromSecret: true
              # The models the AI gateway serves for the
              # coder and for OpenCode through the same gateway (owner's
              # choice, 2026-10-04).
              model: deepseek-v4.1-flash
              opencodeModel: deepseek-v4.1-flash
              # Pull requests open as drafts while people are testing.
              prDraft: true
              # Commits are the App's bot user, so GitHub shows them as the
              # App: <bot user id>+<slug>[bot]@users.noreply.github.com. The id
              # is the bot user's (GET /users/bored-giant-panda[bot]), not the
              # App's (owner, 2026-10-04).
              gitAuthorName: "bored-giant-panda[bot]"
              gitAuthorEmail: "337696346+bored-giant-panda[bot]@users.noreply.github.com"
              extraEnv:
                # The orchestrator's thread tools are plain http inside the
                # cluster (another-adam-rs bin/adam-coder/README.md, "What the
                # deployment decides").
                MCP_ALLOW_INSECURE: "true"
            github:
              auth: app
              # No repository creation by the coder (needs the App's
              # Administration permission).
              createRepoOwners: [ ]
              app:
                # The App bored-giant-panda, owned by vymalo (application ID
                # 5185821); `id` is its client ID, the JWT's `iss`. The coder
                # works on vymalo's repositories only. No installation ID: the
                # coder finds the installation of each repository's owner with
                # the App's key (another-adam-rs ADR 0017). Another account in
                # `owners` needs the App installed there, so a public App.
                id: "Iv23li4m1ZrQ8wdwjnQH"
                owners: [ "vymalo" ]
                privateKeySecret: coder-github-app
            # Web search (the system chart's search pod, same namespace) and
            # Context7 (hosted), as optional MCP servers of every conversation:
            # a server that is down at start is skipped, not a crash loop
            # (another-adam-rs ADR 0018). Plain http inside the cluster is
            # allowed by MCP_ALLOW_INSECURE above. Keys: the AWS properties
            # `search_mcp_token` and `context7_api_key` (chart defaults).
            mcp:
              websearch:
                url: "http://another-agentic-websearch.another-agentic-system.svc:8080/mcp"
              context7:
                enabled: true
            # The coder's run store is the database `coder` in the system
            # chart's one CNPG cluster (owner decision, 2026-10-04): no Cluster
            # of its own. The system chart renders the Secret coder-db-uri (key
            # uri) with sharedDatabase.coder.enabled below.
            database:
              enabled: false
              existingSecret:
                name: coder-db-uri
            externalSecrets:
              key: prod/another-agentic/env
              properties:
                modelApiKey: model_api_key
                # github.auth=app: no token.
                githubToken: null
                a2aBearerTokens: coder_a2a_token
      # The Secret `coder-github-app` (key private-key.pem), from the AWS
      # property `github_app_private_key`. One rawResource: its name comes
      # from forceRename.
      - repoURL: https://bjw-s-labs.github.io/helm-charts
        targetRevision: "4.*"
        chart: app-template
        helm:
          releaseName: coder-github-app
          valuesObject:
            rawResources:
              github-app-key:
                enabled: true
                forceRename: coder-github-app
                apiVersion: external-secrets.io/v1
                kind: ExternalSecret
                spec:
                  spec:
                    refreshInterval: 1h
                    secretStoreRef:
                      name: ssegning-aws
                      kind: ClusterSecretStore
                    target:
                      name: coder-github-app
                      creationPolicy: Owner
                    data:
                      - secretKey: private-key.pem
                        remoteRef:
                          key: prod/another-agentic/env
                          property: github_app_private_key
    destination:
      name: netcup-k8s
      namespace: another-agentic-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      managedNamespaceMetadata:
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/audit: restricted
      automated:
        prune: true
        selfHeal: true

  - name: another-agentic-system
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: another-agentic
    source:
      repoURL: https://github.com/vymalo/another-agentic-system
      targetRevision: HEAD
      path: deploy/chart
      helm:
        releaseName: another-agentic-system
        # Mirrors deploy/chart/examples/netcup.values.yaml (what that repo's CI
        # renders), except `sharing`. Agents: the
        # chart's defaults, the coder (by its card at the Service above) and the
        # chat agent; no researcher.
        valuesObject:
          host: agentic.servers.segning.pro
          auth:
            issuer: https://auth.verif.fyi/realms/vymalo
          ingress:
            # DNS-01 through the Cloudflare token. Whether that token can edit
            # the zone segning.pro is UNVERIFIED; if not, name another
            # ClusterIssuer here.
            clusterIssuer: cert-cloudflare
          model:
            # The same AI gateway as the coder's (with /v1). Its URL is kept in
            # AWS, property `model_base_url`, not in git (owner's choice,
            # 2026-10-04; another-agentic-system #182). Needs an orchestrator
            # image at or after that change (the chart's README, "The pinned
            # orchestrator image").
            baseUrl: ""
            baseUrlFromSecret: true
          chat:
            # The gateway's model for the chat agent (owner's choice,
            # 2026-10-04).
            model: glm-5.3
          # Thread sharing by revocable link, all three tiers: private,
          # internal (signed-in) and public (another-agentic-system ADR 0040;
          # owner's choice, 2026-10-06). Public reads are rate limited and hide
          # step input, output and files (the chart's defaults). The AWS
          # property `sharing_secret` (openssl rand -hex 32, never the value of
          # `thread_tools_secret`) must exist before this syncs: a missing one
          # fails the orchestrator's whole ExternalSecret.
          sharing:
            mode: public
          # Titles and descriptions (orchestrator.tasks.*.model) stay off until
          # the owner names a small alias for them.
          # Web search (our own MCP pod on Brave) and Context7 (hosted), which a
          # person can attach to a conversation; the orchestrator holds both
          # keys (another-agentic-system ADR 0024, deploy/chart/README.md "Web
          # search and Context7"). The AWS properties `brave_api_key`,
          # `search_mcp_token` and `context7_api_key` must exist before this
          # syncs: a missing one fails the orchestrator's whole ExternalSecret.
          webSearch:
            enabled: true
            # The chart's default also excepts ::ffff:0:0/96, which this
            # cluster's API server refuses in a NetworkPolicy ("must not have
            # an IPv4-mapped IPv6 address"), failing the whole sync. Such
            # addresses leave the pod as IPv4, which egressExcept covers.
            # Drop this override once the chart's default no longer has it.
            egressExceptV6:
              - fc00::/7
              - fe80::/10
              - 64:ff9b::/96
          # One CNPG cluster (owner decision, 2026-10-04): the coder's
          # database, role and Secret coder-db-uri in this chart's cluster (AWS
          # property coder_db_password). Needs CNPG 1.25 or later (the
          # Database CRD). coder-github-app keeps its own Cluster for now: a
          # second entry needs an AWS property of its own.
          sharedDatabase:
            coders:
              - name: coder
                secretName: coder-db-uri
                passwordProperty: coder_db_password
          orchestrator:
            toolServers:
              websearch:
                enabled: true
              context7:
                enabled: true
          networkPolicy:
            # Only Traefik (namespace traefik-system on netcup, see
            # charts/cd-networking) may reach the edge.
            ingressControllerNamespace: traefik-system
    destination:
      name: netcup-k8s
      namespace: another-agentic-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      managedNamespaceMetadata:
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/audit: restricted
      automated:
        prune: true
        selfHeal: true

  # another-agentic-operator — the adam operator of vymalo/another-adam-rs
  # (it began in vymalo/another-agentic-platform, §59a "Operator v0"): ONE
  # replica of the operator binary, namespaced, watching only
  # `another-agentic-system` (a Role and RoleBinding there, no ClusterRole, no
  # right on Secrets), which reconciles the custom resources AgentService and
  # AgentConfig and serves the agent registry. No AgentService exists yet: the
  # coder keeps running from `another-agentic-coder` above, and nothing here
  # touches it.
  #
  # Chart: `deploy/operator` of the adam-rs repo at HEAD, release
  # `adam-operator` (the chart fixes every object's name, so the registry
  # Service is `adam-operator-registry` whatever the release is called). The
  # image is `ghcr.io/vymalo/another-adam-rs/operator`; its tag (`image.tag`,
  # `sha-<7>`) is bumped on main by adam-rs's CI and is NOT set here. This is
  # the chart's `examples/netcup.values.yaml`; the rest are the chart's
  # defaults.
  #
  # The CRDs are NOT in this chart: Application `adam-operator-crds` in the
  # `infrastructure` project (charts/cd/values.yaml, never pruned). Until they
  # exist the operator pod stays unready.
  #
  # This Application used to deploy `aap-operator` from
  # vymalo/another-agentic-platform. Same Application, new source: Argo
  # replaces the Deployment, Service, Role, NetworkPolicy and ExternalSecret
  # named `aap-operator*` with `adam-operator*` in one sync (prune is on). The
  # new operator marks what it makes `app.kubernetes.io/managed-by:
  # adam-operator`, and refuses an object marked otherwise (NameConflict), so
  # no AgentService may exist while the old operator is still running: none
  # does (`kubectl get agentservices -A` is empty before this merges).
  #
  # Secret: the registry's bearer token is the AWS property
  # `agent_registry_token` of `prod/another-agentic/env`, read through the
  # ClusterSecretStore `ssegning-aws` by the chart's own ExternalSecret
  # `adam-operator-registry` (defaults: store, key and property are the ones in
  # the chart's values), mounted as a file, never an env var. The property is
  # the one the old operator read; nothing new is needed in AWS and nothing
  # secret is in git. If the property is missing the operator pod waits in
  # ContainerCreating.
  #
  # The image ghcr.io/vymalo/another-adam-rs/operator is public: an anonymous
  # manifest request for sha-2644008 returned 200 (verified 2026-10-07). Like
  # the other images of the family, it needs no pull secret.
  #
  # NOT changed here: the orchestrator's own registry URL
  # (`AGENT_REGISTRY_URL`) in the another-agentic-system Application above and
  # its chart. It stays on its current registry until it is pointed at
  # `http://adam-operator-registry.another-agentic-system.svc:8080/registry/v1/agents`
  # with the same token. The ingress rule below is ready for that.
  - name: another-agentic-operator
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: another-agentic
    source:
      repoURL: https://github.com/vymalo/another-adam-rs
      targetRevision: HEAD
      path: deploy/operator
      helm:
        releaseName: adam-operator
        valuesObject:
          # watchNamespace is left empty: the release's namespace,
          # another-agentic-system.
          externalSecrets:
            enabled: true
          registry:
            # The registry document's own URL, sent as its `anchor`.
            publicUrl: http://adam-operator-registry.another-agentic-system.svc:8080/registry/v1/agents
          networkPolicy:
            registry:
              # Who may read the registry: the orchestrator's pods only (the
              # chart refuses an empty list while there is a token). Labels
              # of another-agentic-system's selector for the orchestrator.
              allowFrom:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/name: another-agentic-system
                      app.kubernetes.io/component: orchestrator
    destination:
      name: netcup-k8s
      namespace: another-agentic-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      managedNamespaceMetadata:
        labels:
          pod-security.kubernetes.io/enforce: baseline
          pod-security.kubernetes.io/warn: restricted
          pod-security.kubernetes.io/audit: restricted
      automated:
        prune: true
        selfHeal: true

  - name: jellyfin
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: charts/home-apps/jellyfin
    destination:
      server: https://kubernetes.default.svc
      namespace: jellyfin
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

  - name: keycloak-ha
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: keycloak
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: charts/home-apps/keycloak-ha
      helm:
        valuesObject:
          keycloak:
            ingress:
              main:
                enabled: false
          db:
            enabled: true
    destination:
      name: home-remote
      namespace: keycloak
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  # Full HA Redis (sentinel + TLS + RedisInsight/oauth2 + external-secrets)
  # on the remote (Hetzner) cluster. Uses the chart defaults as-is.
  - name: redis-ha
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: redis
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: charts/home-apps/redis-ha

    destination:
      name: home-remote
      namespace: redis-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

