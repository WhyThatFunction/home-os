      automated:
        prune: true
        selfHeal: true

  # ArgoCD repository credential (ESO, argocd ns) for the PRIVATE
  # vaam-apps/vaam-apps repo, so the `vaam` Application above can even clone
  # its source. Same PAT and AWS SM key (prod/meta/test-app) the fleet's
  # other GHCR/GitHub credentials already use, mirroring
  # lightbridge-authz-ghcr-creds above.
  - name: vaam-apps-argocd-creds
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: serverless/k/vaam-apps
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

