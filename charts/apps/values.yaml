  - name: endpoints
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: charts/home-apps/endpoints
    destination:
      server: https://kubernetes.default.svc
      namespace: endpoints
    syncPolicy:
      automated:
        prune: true
        selfHeal: true

  - name: music
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: charts/home-apps/music
    destination:
      server: https://kubernetes.default.svc
      namespace: music
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

  # Self-hosted observability backend (grafana/otel-lgtm all-in-one).
  # Public OTLP ingest for the vymalo mobile app at otel.vymalo.com (HTTPRoute
  # in the leaf chart); Grafana UI on grafana.home.ssegning (home network only).
  - name: otel-lgtm
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: charts/home-apps/otel-lgtm
    destination:
      server: https://kubernetes.default.svc
      namespace: otel-lgtm
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

  - name: opfs-webauthn
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: serverless/k/opfs-webauthn
    destination:
      server: https://kubernetes.default.svc
      namespace: serverless-opfs-webauthn
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

  # Deploys the vaam-store/platform 8-service fleet's 8 Argo CD Applications +
  # its ArgoCD OCI repo cred + image-updater GHCR cred + ImageUpdater CR (all
  # kustomize-forced into the argocd namespace, same pattern as
  # vymalo-shop-deployer above). See serverless/k/vaam-store-platform/
  # argocd-application.yaml's own header for the sync-ordering design.
  - name: vaam-store-platform-deployer
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: serverless/k/vaam-store-platform
    destination:
      server: https://kubernetes.default.svc
      namespace: serverless-vaam-store-platform
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

  # Deploys the vaam-store/frontends web apps' 3 Argo CD Applications + their
  # ImageUpdater CR (kustomize-forced into the argocd namespace, same pattern as
  # vaam-store-platform-deployer above).
  #
  # Separate from vaam-store-platform-deployer on purpose: different source
  # repo, different image namespace (ghcr.io/vaam-store/frontends/* vs
  # .../platform/*), different cosign signing identities, and no create-time
  # ordering between the two fleets -- the frontends call the platform over
  # in-cluster DNS at runtime only. It does REUSE two of that deployer's
  # resources rather than duplicating them (the ghcr.io/vaam-store/charts OCI
  # repo cred and the registry-wide GHCR pull secret); see
  # serverless/k/vaam-store-frontends/kustomization.yaml for why, and for the
  # dependency that creates.
  #
  # vaam-store/frontends#24.
  - name: vaam-store-frontends-deployer
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: serverless/k/vaam-store-frontends
    destination:
      server: https://kubernetes.default.svc
      namespace: serverless-vaam-store-frontends
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

  # Provisions the ArgoCD repository credential (ESO, argocd ns) that lets ArgoCD
  # pull the PRIVATE converse-frontends OCI chart. The converse-ui workload itself
  # is deployed by ai-helm's charts/apps app-of-apps, not here.
  - name: converse-deployer
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: serverless/k/converse
    destination:
      server: https://kubernetes.default.svc
      namespace: serverless-converse
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

  - name: lightbridge-authz-ghcr-creds
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: external
    source:
      repoURL: https://github.com/whythatfunction/home-os
      targetRevision: HEAD
      path: serverless/k/lightbridge-authz
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
      automated:
        prune: true
        selfHeal: true

