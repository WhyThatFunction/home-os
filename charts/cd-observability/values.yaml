          # endpoints, and therefore ArgoCD unable to server-side-diff any
          # Application containing an OpenTelemetryCollector - keycloak-ha and
          # openobserve both sat Sync=Unknown with selfHeal silently inert.
          #
          # Disabled rather than patched: the generated policy hardcodes a node
          # endpoint, so it is wrong on any cluster where pods reach the API by
          # service IP.
          #
          # `operand.networkpolicy` is deliberately left ENABLED. It does
          # generate a policy - openobserve-collector-networkpolicy - but that
          # one is `policyTypes: [Ingress]` only, allowing 4317/4318/8888/13133
          # inbound and leaving egress unrestricted. So it cannot lock a
          # collector away from anything, and the collector has run 13 days
          # through it. Only the operator's own policy has the egress bug.
          manager:
            featureGatesMap:
