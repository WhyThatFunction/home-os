applications:
  - name: local-kube-state-metrics
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://prometheus-community.github.io/helm-charts
      # Pinned to the 8.x line. Unpinned "*" rolled this Deployment 10 times in
      # 26 days -- 8 of them functionally no-ops, because the chart stamps
      # helm.sh/chart into the POD TEMPLATE labels, so every upstream patch
      # release restarts the pod with an identical image and config. It also
      # carried an unreviewed v2.19.1 -> v2.20.0 image bump straight past the
      # PR gate.
      targetRevision: "8.*"
      chart: kube-state-metrics
      helm:
        valuesObject:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
    destination:
      server: https://kubernetes.default.svc
      namespace: observability
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: netcup-kube-state-metrics
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://prometheus-community.github.io/helm-charts
      # See the note on local-kube-state-metrics above.
      targetRevision: "8.*"
      chart: kube-state-metrics
      helm:
        releaseName: kube-state-metrics
        valuesObject:
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
    destination:
      name: netcup-k8s
      namespace: observability
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: otel-operator
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      targetRevision: "0.*"
      chart: opentelemetry-operator
      helm:
        releaseName: opentelemetry-operator
        valuesObject:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          admissionWebhooks:
            autoGenerateCert:
              enabled: false
            certManager:
              issuerRef:
                kind: ClusterIssuer
                name: self-signed-ca
                group: cert-manager.io
    destination:
      name: home-remote
      namespace: opentelemetry-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: otel-operator-local
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      targetRevision: "0.*"
      chart: opentelemetry-operator
      helm:
        releaseName: opentelemetry-operator
        valuesObject:
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          admissionWebhooks:
            autoGenerateCert:
              enabled: false
            certManager:
              issuerRef:
                kind: ClusterIssuer
                name: self-signed-ca
                group: cert-manager.io
    destination:
      server: https://kubernetes.default.svc
      namespace: opentelemetry-system
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
      automated:
        prune: true
        selfHeal: true

  - name: grafana-operator-local
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    project: infrastructure
    source:
      repoURL: oci://ghcr.io/grafana/helm-charts/grafana-operator
      targetRevision: "5.*"
      chart: grafana-operator
      helm:
        releaseName: grafana-operator
    destination:
      server: https://kubernetes.default.svc
      namespace: observability
    syncPolicy:
      syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true
        - SkipDryRunOnMissingResource=true
      automated:
        prune: true
        selfHeal: true

