{{ with .Values.solvers.cloudflare }}
{{ if .enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cert-cloudflare
  namespace: {{ include "common.names.namespace" $ }}
  labels:
    {{ include "common.labels.standard" $ | nindent 4 }}
  annotations:
    {{- with .commonAnnotations }}
    {{ include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
    {{- end }}
    {{- with $.Values.commonAnnotations }}
    {{ include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
    {{- end }}
spec:
  acme:
    # The ACME server URL
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email address used for ACME registration
    email: {{ include "common.tplvalues.render" ( dict "value" .email "context" $ ) }}
    # Name of a secret used to store the ACME account private key
    privateKeySecretRef:
      name: cert-cloudflare
    # Enable the HTTP-01 challenge provider
    solvers:
      - dns01:
          cloudflare:
            # Email address used for ACME registration
            email: {{ include "common.tplvalues.render" ( dict "value" .email "context" $ ) }}
            apiKeySecretRef:
              name: cloudflare-secret
              key: api-token
{{- with $.Values.solvers.route53 }}
{{- if .enabled }}
      # Scoped DNS-01 solver for zones delegated away from Cloudflare.
      # See charts/cert/values.yaml `solvers.route53` for why this exists.
      - dns01:
          route53:
            region: {{ .region | quote }}
            {{- with .hostedZoneID }}
            hostedZoneID: {{ . | quote }}
            {{- end }}
            accessKeyIDSecretRef:
              name: {{ .secretName }}
              key: {{ .accessKeyIDKey }}
            secretAccessKeySecretRef:
              name: {{ .secretName }}
              key: {{ .secretAccessKeyKey }}
        selector:
          dnsZones:
            {{- range .dnsZones }}
            - {{ . | quote }}
            {{- end }}
{{- end }}
{{- end }}
{{ end }}
{{ end }}