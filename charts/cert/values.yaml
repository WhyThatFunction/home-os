
global:
  issuer:
    email: "selastlambou@protonmail.com"

solvers:
  cloudflare:
    enabled: true
    enabledStaging: false
    email: "{{ .Values.global.issuer.email }}"
    commonAnnotations: ~

  # A DEDICATED ClusterIssuer (`cert-route53`) for zones Cloudflare is NOT
  # authoritative for. It exists because `camer.digital` is a Cloudflare zone
  # but `ai.camer.digital` is delegated away by NS records to Route 53:
  #
  #   $ dig +short NS ai.camer.digital
  #   ns-1502.awsdns-59.org.  ns-409.awsdns-51.com.
  #   ns-1914.awsdns-47.co.uk. ns-556.awsdns-05.net.
  #
  # The Cloudflare solver writes `_acme-challenge.<name>` into the
  # `camer.digital` zone and the API returns 200, so the Challenge reports
  # `presented: true` and looks healthy — but the record sits BELOW a
  # delegation point, so Cloudflare's own nameservers answer with a referral
  # instead of the TXT and no resolver ever reads it. cert-manager's
  # self-check then loops on "DNS record not yet propagated" forever;
  # `traefik/ai-certificate` sat in that state for 32 days. Wildcards cannot
  # fall back to the HTTP-01 issuer (`cert-home-cert-http`) the way the other
  # `*.ai.camer.digital` certs do — ACME only issues wildcards via DNS-01.
  #
  # WHY A SEPARATE ISSUER, not a second solver on `cert-cloudflare`.
  # This was first shipped (#138) as an extra `dns01` entry on the existing
  # `cert-cloudflare` issuer, scoped by `selector.dnsZones`, on the assumption
  # that a broken solver could only affect the names its selector matched.
  # That assumption is WRONG and it caused an incident on 2026-08-23:
  # cert-manager validates EVERY solver's secretRefs when it reconciles the
  # ISSUER, not per-challenge, so the credential Secret merely being absent
  # for a moment took the whole issuer down —
  #
  #   reason:  InvalidSolver
  #   status:  "False"
  #   message: failed to get secret "route53-secret": secrets
  #            "route53-secret" not found
  #
  # — and with it the Cloudflare solver serving ~20 unrelated certificates.
  # An issuer is a single failure domain shared by all of its solvers. Keeping
  # the AWS-credentialled solver on its own issuer means a missing, rotated or
  # revoked Route 53 key can only ever stop `ai.camer.digital` from renewing.
  #
  # Note the residual sharp edge this does NOT fix: cert-manager does not
  # re-reconcile an Issuer when a previously-missing solver Secret later
  # appears. If `route53-secret` is not present when this issuer is first
  # applied, `cert-route53` stays `InvalidSolver` until the cert-manager
  # controller is restarted. ArgoCD does surface that (the Application goes
  # Degraded — confirmed: the `cert-remote` app's health transitioned back to
  # Healthy at the exact second the controller restart fixed the issuer), so
  # it is visible rather than silent, but it is not self-healing.
  #
  # Defaults to DISABLED for the same reason as `vaamCA` below: `charts/cert`
  # is deployed by three Applications (charts/cd-certs/values.yaml) and only
  # `cert-remote` (home-remote) serves names under `ai.camer.digital`. The
  # credential Secret is created there too, so enabling this on a cluster that
  # lacks it would only add an issuer that cannot authenticate.
  route53:
    enabled: false
    enabledStaging: false
    email: "{{ .Values.global.issuer.email }}"
    # Route 53 is a global service, but the AWS SDK still needs a region for
    # signing. Matches the region of the account's other resources.
    region: "eu-central-1"
    # Optional. Leave empty to let cert-manager discover the zone by name,
    # which additionally requires `route53:ListHostedZonesByName` in the IAM
    # policy. Pin the ID here to drop that permission.
    hostedZoneID: ""
    # Zones this issuer owns — i.e. the ones delegated away from Cloudflare.
    # Found by checking every zone this platform serves, not just the one that
    # broke: `ai.kivoyo.com` is delegated to Route 53 as well. Nothing points
    # at this issuer for kivoyo today (its two certs, `converse/ai.kivoyo.com-tls`
    # and `converse-gateway/core-gateway-redirect-kivoyo-api-tls`, are HTTP-01
    # and issue fine), but listing it here means the next wildcard or DNS-01
    # cert under it does not repeat the 32-day silent stall. Re-check with:
    #   for z in <zone>; do dig +short NS "$z"; done
    dnsZones:
      - "ai.camer.digital"
      - "ai.kivoyo.com"
    # Secret in cert-manager's cluster-resource namespace (kube-system here).
    # Created by the `cert-remote` Application from AWS Secrets Manager via
    # external-secrets, mirroring how `cloudflare-secret` is provisioned.
    secretName: "route53-secret"
    accessKeyIDKey: "access-key-id"
    secretAccessKeyKey: "secret-access-key"
    commonAnnotations: ~
  http:
    enabled: true
    enabledStaging: true
    ingressClassName: "traefik"
    email: "{{ .Values.global.issuer.email }}"
    commonAnnotations: ~
  selfSigned:
    enabled: true
    enabledStaging: true
    commonAnnotations: ~
  # Dedicated CA trust anchor for vaam-store/platform's service-to-service
  # mTLS (ADR-0016 amendment, replacing the bespoke Ed25519 signed-request
  # scheme). Kept separate from `self-signed-ca` (the home-lab CA) so a
  # compromise of one trust domain cannot mint identities in the other.
  #
  # Defaults to DISABLED here. `charts/cert` is deployed by three Argo
  # Applications (charts/cd-certs/values.yaml: `cert`, `cert-remote`,
  # `cert-netcup`), only one of which (`cert`, the home cluster) actually
  # runs vaam-store/platform. ArgoCD's multi-source `valuesObject` deep-MERGES
  # on top of this chart's defaults rather than replacing them, so a
  # default of `enabled: true` here would silently also stand up a
  # `vaam-ca` ClusterIssuer — each with its OWN independently self-signed
  # root key, despite sharing a name — on `cert-remote` and `cert-netcup`
  # too: unnecessary CA private-key material on clusters that don't need it,
  # and a genuine footgun for anyone who later assumes `vaam-ca` names one
  # trust domain. CA key material should only exist where a human opted a
  # cluster in explicitly; see the `cert` application's `valuesObject` in
  # `charts/cd-certs/values.yaml` for that opt-in.
  #
  # Root lifetime (this chart owns the root only):
  #   duration: 2 years — long enough that root rotation (which means
  #     redistributing a new CA bundle to all 8 vaam-platform services) stays
  #     a rare, planned operation, but short enough to bound the exposure
  #     window of an undetected CA-key compromise. ADR-0016 explicitly leaves
  #     CA-key compromise as an unaddressed risk and rejects building
  #     revocation infrastructure (OCSP is being retired industry-wide, and a
  #     private internal CA has even less reason to grow one) — a
  #     non-infinite root lifetime is the one blast-radius bound that comes
  #     for free, not a fix for that risk.
  #   renewBefore: 30 days — operational lead time for a single-operator
  #     cluster to notice the renewal (cert-manager re-issues automatically)
  #     and, on an actual root ROTATION (new key, not just a renewed cert),
  #     to plan redeploying the new CA bundle to all consuming services.
  #
  # Leaf lifetime (for the per-service Certificates that consuming charts in
  # `vaam-platform` create against the `vaam-ca` ClusterIssuer below — NOT
  # created by this chart):
  #   duration: 24h, renewBefore: 8h — short-lived leaves are the actual
  #   revocation strategy here (ADR-0016): a stolen leaf key is only useful
  #   for at most ~24h without any CRL/OCSP infrastructure. 24h matches
  #   common short-lived-mTLS practice (e.g. Istio's default) and is well
  #   within cert-manager's automated-renewal loop; renewBefore at 1/3 of
  #   duration matches cert-manager's own default renewal ratio.
  vaamCA:
    enabled: false
    commonName: "Vaam Platform Root CA"
    duration: "17520h" # 2 years
    renewBefore: "720h" # 30 days
    commonAnnotations: ~

commonAnnotations: {}
  #"helm.sh/hook": "post-install,post-upgrade,pre-delete"
  #"helm.sh/hook-delete-policy": "hook-succeeded"
  #"helm.sh/hook-weight": "10"

cert-manager:
  installCRDs: true
  # Enable cert-manager's Gateway API integration: lets it solve ACME HTTP-01
  # via `gatewayHTTPRoute` solvers and honour `cert-manager.io/cluster-issuer`
  # annotations on Gateways (the gateway-shim). Off by default. The AI platform's
  # core-gateway (ai-helm) uses an HTTP-01 gatewayHTTPRoute Issuer to get TLS for
  # api.ai-v2.camer.digital without a DNS token.
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true